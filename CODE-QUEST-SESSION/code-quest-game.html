<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE QUEST - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-size: 14px;
            text-shadow: 0 0 10px #0f0;
            pointer-events: none;
            z-index: 100;
        }
        
        .stat-bar {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }
        
        .bar-container {
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f0;
            margin-left: 10px;
            position: relative;
        }
        
        .bar-fill {
            height: 100%;
            background: #0f0;
            transition: width 0.3s;
        }
        
        .health-bar { background: #f00; }
        .energy-bar { background: #00f; }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0f0;
            font-size: 12px;
            text-shadow: 0 0 5px #0f0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="stat-bar">
            <span>HEALTH:</span>
            <div class="bar-container">
                <div class="bar-fill health-bar" id="healthBar"></div>
            </div>
            <span id="healthText"></span>
        </div>
        <div class="stat-bar">
            <span>ENERGY:</span>
            <div class="bar-container">
                <div class="bar-fill energy-bar" id="energyBar"></div>
            </div>
            <span id="energyText"></span>
        </div>
        <div style="margin-top: 10px;">
            <div>ENEMIES: <span id="enemyCount">0</span></div>
            <div>FPS: <span id="fps">60</span></div>
        </div>
    </div>
    
    <div id="controls">
        W/S - Forward/Back | A/D - Rotate | Click - Attack | Space - Dash | Shift - Block
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
// Game state
const game = {
    scene: null,
    camera: null,
    renderer: null,
    player: null,
    enemies: [],
    keys: {},
    mouse: { x: 0, y: 0 },
    stats: {
        health: 100,
        maxHealth: 100,
        energy: 100,
        maxEnergy: 100,
        attack: 10,
        defense: 5,
        speed: 5
    },
    abilities: {
        dash: { cooldown: 0, maxCooldown: 3 },
        block: { cooldown: 0, maxCooldown: 2, active: false }
    },
};

// Check if Three.js loaded
if (typeof THREE === 'undefined') {
    document.body.innerHTML = '<div style="color: white; padding: 20px;">ERROR: Three.js failed to load. Check your internet connection.</div>';
    throw new Error('Three.js not loaded');
}

// Initialize Three.js
function init() {
    console.log('Initializing low-poly game...');

    // Scene with atmospheric sky color
    game.scene = new THREE.Scene();
    game.scene.background = new THREE.Color(0x87ceeb); // Sky blue
    
    // Camera
    game.camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    game.camera.position.set(0, 8, 12);
    game.camera.lookAt(0, 0, 0);
    
    // Renderer
    const canvas = document.getElementById('gameCanvas');
    game.renderer = new THREE.WebGLRenderer({ 
        canvas: canvas,
        antialias: true 
    });
    game.renderer.setSize(window.innerWidth, window.innerHeight);
    game.renderer.setPixelRatio(window.devicePixelRatio);
    
    // Brighter lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    game.scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 20, 10);
    game.scene.add(dirLight);
    
    // Additional point light at origin
    const pointLight = new THREE.PointLight(0xffffff, 1, 100);
    pointLight.position.set(0, 10, 0);
    game.scene.add(pointLight);
    
    // Ground - low poly style with earthy tone
    const groundGeometry = new THREE.PlaneGeometry(100, 100, 20, 20);
    // Add slight height variation for low-poly terrain feel
    const groundVerts = groundGeometry.attributes.position;
    for (let i = 0; i < groundVerts.count; i++) {
        const x = groundVerts.getX(i);
        const y = groundVerts.getY(i);
        // Subtle random height variation
        groundVerts.setZ(i, Math.sin(x * 0.3) * Math.cos(y * 0.3) * 0.15 + Math.random() * 0.05);
    }
    groundGeometry.computeVertexNormals();

    const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0x5d4e37,
        flatShading: true,
        roughness: 0.9,
        metalness: 0.1
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    game.ground = ground;
    game.scene.add(ground);

    console.log('Low-poly ground added');

    // Subtle grid (darker tone)
    const gridHelper = new THREE.GridHelper(100, 25, 0x3d3020, 0x3d3020);
    gridHelper.position.y = 0.02;
    game.scene.add(gridHelper);
    
    console.log('Grid added');
    
    // Create player
    createPlayer();
    console.log('Player created at:', game.player.position);
    
    // Create initial enemies
    for (let i = 0; i < 5; i++) {
        spawnEnemy();
    }
    console.log('Enemies spawned:', game.enemies.length);
    
    // Event listeners
    window.addEventListener('resize', onResize);
    document.addEventListener('keydown', (e) => game.keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', (e) => game.keys[e.key.toLowerCase()] = false);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mousedown', onMouseDown);
    document.addEventListener('contextmenu', (e) => e.preventDefault()); // Disable right-click menu
    
    console.log('Starting animation loop...');
    
    // Start game loop
    animate();
}

// Create player with hierarchical body parts - LOW POLY STYLE
function createPlayer() {
    // Main container
    game.player = new THREE.Group();
    game.player.position.set(0, 0, 0);

    // LOW POLY MATERIALS - Flat shading for faceted look
    const torsoMaterial = new THREE.MeshStandardMaterial({
        color: 0x4a90d9,
        flatShading: true,
        metalness: 0.2,
        roughness: 0.8
    });
    const limbMaterial = new THREE.MeshStandardMaterial({
        color: 0x3a7bc8,
        flatShading: true,
        metalness: 0.2,
        roughness: 0.8
    });
    const accentMaterial = new THREE.MeshStandardMaterial({
        color: 0x2d5a8a,
        flatShading: true,
        metalness: 0.3,
        roughness: 0.7
    });
    const visorMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 0.8,
        flatShading: true
    });

    // TORSO - Octahedron stretched vertically for low-poly chest
    const torsoGeometry = new THREE.CylinderGeometry(0.35, 0.45, 1.0, 6);
    const torso = new THREE.Mesh(torsoGeometry, torsoMaterial);
    torso.position.y = 1.5;
    game.player.torso = torso;
    game.player.add(torso);

    // SHOULDER PADS - Low poly spheres
    const shoulderGeometry = new THREE.IcosahedronGeometry(0.18, 0);
    const leftShoulder = new THREE.Mesh(shoulderGeometry, accentMaterial);
    leftShoulder.position.set(-0.45, 0.35, 0);
    leftShoulder.scale.set(1, 0.8, 1);
    torso.add(leftShoulder);
    const rightShoulder = new THREE.Mesh(shoulderGeometry, accentMaterial);
    rightShoulder.position.set(0.45, 0.35, 0);
    rightShoulder.scale.set(1, 0.8, 1);
    torso.add(rightShoulder);

    // HEAD - Dodecahedron for faceted skull look
    const headGeometry = new THREE.DodecahedronGeometry(0.32, 0);
    const headMaterial = new THREE.MeshStandardMaterial({
        color: 0x4a90d9,
        flatShading: true,
        metalness: 0.2,
        roughness: 0.8
    });
    const head = new THREE.Mesh(headGeometry, headMaterial);
    head.position.y = 0.85;
    head.scale.set(1, 1.1, 1);
    game.player.head = head;
    torso.add(head);

    // VISOR - Angular strip across face
    const visorGeometry = new THREE.BoxGeometry(0.5, 0.12, 0.2);
    const visor = new THREE.Mesh(visorGeometry, visorMaterial);
    visor.position.set(0, 0, -0.28);
    game.player.visor = visor;
    head.add(visor);

    // RIGHT ARM HIERARCHY
    const rightArmPivot = new THREE.Group();
    rightArmPivot.position.set(0.45, 0.3, 0);
    torso.add(rightArmPivot);
    game.player.rightArmPivot = rightArmPivot;

    // Upper arm - tapered cylinder
    const upperArmGeometry = new THREE.CylinderGeometry(0.08, 0.12, 0.5, 5);
    const rightUpperArm = new THREE.Mesh(upperArmGeometry, limbMaterial.clone());
    rightUpperArm.position.y = -0.3;
    game.player.rightUpperArm = rightUpperArm;
    rightArmPivot.add(rightUpperArm);

    // Elbow joint
    const elbowGeometry = new THREE.IcosahedronGeometry(0.09, 0);
    const rightElbow = new THREE.Mesh(elbowGeometry, accentMaterial.clone());
    rightElbow.position.y = -0.55;
    rightUpperArm.add(rightElbow);

    const rightElbowPivot = new THREE.Group();
    rightElbowPivot.position.y = -0.55;
    rightUpperArm.add(rightElbowPivot);
    game.player.rightElbowPivot = rightElbowPivot;

    // Lower arm
    const lowerArmGeometry = new THREE.CylinderGeometry(0.06, 0.09, 0.45, 5);
    const rightLowerArm = new THREE.Mesh(lowerArmGeometry, limbMaterial.clone());
    rightLowerArm.position.y = -0.25;
    game.player.rightLowerArm = rightLowerArm;
    rightElbowPivot.add(rightLowerArm);

    // WRIST PIVOT - at the end of lower arm
    const rightWristPivot = new THREE.Group();
    rightWristPivot.position.y = -0.25;
    rightLowerArm.add(rightWristPivot);
    game.player.rightWristPivot = rightWristPivot;

    // Hand/fist at wrist - LARGE GLOWING ENERGY FIST
    const handGeometry = new THREE.IcosahedronGeometry(0.18, 1);
    const handMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 1.5,
        flatShading: true,
        metalness: 0.5,
        roughness: 0.1
    });
    const rightHand = new THREE.Mesh(handGeometry, handMaterial);
    rightHand.position.y = -0.1;
    rightWristPivot.add(rightHand);
    game.player.rightHand = rightHand;

    // Right fist electricity - multiple arcs around the fist
    const rightElectricity = [];
    const electricMaterial = new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
    });
    for (let i = 0; i < 6; i++) {
        const points = [];
        const angle = (i / 6) * Math.PI * 2;
        // Create jagged lightning bolt
        points.push(new THREE.Vector3(0, 0, 0));
        points.push(new THREE.Vector3(Math.cos(angle) * 0.15, Math.sin(angle) * 0.15, Math.random() * 0.1 - 0.05));
        points.push(new THREE.Vector3(Math.cos(angle) * 0.25, Math.sin(angle) * 0.25, Math.random() * 0.15 - 0.075));
        points.push(new THREE.Vector3(Math.cos(angle) * 0.35, Math.sin(angle) * 0.35, Math.random() * 0.1 - 0.05));
        const arcGeometry = new THREE.BufferGeometry().setFromPoints(points);
        const arc = new THREE.Line(arcGeometry, electricMaterial.clone());
        arc.position.y = -0.1;
        rightWristPivot.add(arc);
        rightElectricity.push(arc);
    }
    game.player.rightElectricity = rightElectricity;

    // Right fist trail - extends behind fist when punching
    const fistTrailGeometry = new THREE.CylinderGeometry(0.03, 0.12, 1.0, 8);
    const fistTrailMaterial = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending
    });
    const rightFistTrail = new THREE.Mesh(fistTrailGeometry, fistTrailMaterial);
    rightFistTrail.rotation.x = Math.PI / 2; // Point along Z axis
    rightFistTrail.position.z = 0.5; // Behind the fist
    rightWristPivot.add(rightFistTrail);
    game.player.rightFistTrail = rightFistTrail;

    // LEFT ARM HIERARCHY
    const leftArmPivot = new THREE.Group();
    leftArmPivot.position.set(-0.45, 0.3, 0);
    torso.add(leftArmPivot);
    game.player.leftArmPivot = leftArmPivot;

    const leftUpperArm = new THREE.Mesh(upperArmGeometry.clone(), limbMaterial.clone());
    leftUpperArm.position.y = -0.3;
    game.player.leftUpperArm = leftUpperArm;
    leftArmPivot.add(leftUpperArm);

    const leftElbow = new THREE.Mesh(elbowGeometry.clone(), accentMaterial.clone());
    leftElbow.position.y = -0.55;
    leftUpperArm.add(leftElbow);

    const leftElbowPivot = new THREE.Group();
    leftElbowPivot.position.y = -0.55;
    leftUpperArm.add(leftElbowPivot);
    game.player.leftElbowPivot = leftElbowPivot;

    const leftLowerArm = new THREE.Mesh(lowerArmGeometry.clone(), limbMaterial.clone());
    leftLowerArm.position.y = -0.25;
    game.player.leftLowerArm = leftLowerArm;
    leftElbowPivot.add(leftLowerArm);

    // LEFT WRIST PIVOT
    const leftWristPivot = new THREE.Group();
    leftWristPivot.position.y = -0.25;
    leftLowerArm.add(leftWristPivot);
    game.player.leftWristPivot = leftWristPivot;

    // Left hand - LARGE GLOWING ENERGY FIST
    const leftHand = new THREE.Mesh(handGeometry.clone(), handMaterial.clone());
    leftHand.position.y = -0.1;
    leftWristPivot.add(leftHand);
    game.player.leftHand = leftHand;

    // Left fist electricity - multiple arcs around the fist
    const leftElectricity = [];
    for (let i = 0; i < 6; i++) {
        const points = [];
        const angle = (i / 6) * Math.PI * 2;
        points.push(new THREE.Vector3(0, 0, 0));
        points.push(new THREE.Vector3(Math.cos(angle) * 0.15, Math.sin(angle) * 0.15, Math.random() * 0.1 - 0.05));
        points.push(new THREE.Vector3(Math.cos(angle) * 0.25, Math.sin(angle) * 0.25, Math.random() * 0.15 - 0.075));
        points.push(new THREE.Vector3(Math.cos(angle) * 0.35, Math.sin(angle) * 0.35, Math.random() * 0.1 - 0.05));
        const arcGeometry = new THREE.BufferGeometry().setFromPoints(points);
        const arc = new THREE.Line(arcGeometry, electricMaterial.clone());
        arc.position.y = -0.1;
        leftWristPivot.add(arc);
        leftElectricity.push(arc);
    }
    game.player.leftElectricity = leftElectricity;

    // Left fist trail - extends behind fist when punching
    const leftFistTrail = new THREE.Mesh(fistTrailGeometry.clone(), fistTrailMaterial.clone());
    leftFistTrail.rotation.x = Math.PI / 2;
    leftFistTrail.position.z = 0.5;
    leftWristPivot.add(leftFistTrail);
    game.player.leftFistTrail = leftFistTrail;

    // RIGHT LEG HIERARCHY
    const rightLegPivot = new THREE.Group();
    rightLegPivot.position.set(0.18, -0.5, 0);
    torso.add(rightLegPivot);
    game.player.rightLegPivot = rightLegPivot;

    // Hip joint
    const hipGeometry = new THREE.IcosahedronGeometry(0.1, 0);
    const rightHip = new THREE.Mesh(hipGeometry, accentMaterial.clone());
    rightLegPivot.add(rightHip);

    const upperLegGeometry = new THREE.CylinderGeometry(0.1, 0.14, 0.55, 5);
    const rightUpperLeg = new THREE.Mesh(upperLegGeometry, limbMaterial.clone());
    rightUpperLeg.position.y = -0.32;
    game.player.rightUpperLeg = rightUpperLeg;
    rightLegPivot.add(rightUpperLeg);

    // Knee joint
    const kneeGeometry = new THREE.IcosahedronGeometry(0.1, 0);
    const rightKnee = new THREE.Mesh(kneeGeometry, accentMaterial.clone());
    rightKnee.position.y = -0.58;
    rightUpperLeg.add(rightKnee);

    const rightKneePivot = new THREE.Group();
    rightKneePivot.position.y = -0.58;
    rightUpperLeg.add(rightKneePivot);
    game.player.rightKneePivot = rightKneePivot;

    const lowerLegGeometry = new THREE.CylinderGeometry(0.07, 0.1, 0.5, 5);
    const rightLowerLeg = new THREE.Mesh(lowerLegGeometry, limbMaterial.clone());
    rightLowerLeg.position.y = -0.28;
    game.player.rightLowerLeg = rightLowerLeg;
    rightKneePivot.add(rightLowerLeg);

    const rightAnklePivot = new THREE.Group();
    rightAnklePivot.position.y = -0.5;
    rightLowerLeg.add(rightAnklePivot);
    game.player.rightAnklePivot = rightAnklePivot;

    // Foot - angular wedge
    const footGeometry = new THREE.ConeGeometry(0.12, 0.35, 4);
    const rightFoot = new THREE.Mesh(footGeometry, accentMaterial.clone());
    rightFoot.rotation.x = Math.PI / 2;
    rightFoot.position.set(0, -0.05, 0.1);
    game.player.rightFoot = rightFoot;
    rightAnklePivot.add(rightFoot);

    // LEFT LEG HIERARCHY
    const leftLegPivot = new THREE.Group();
    leftLegPivot.position.set(-0.18, -0.5, 0);
    torso.add(leftLegPivot);
    game.player.leftLegPivot = leftLegPivot;

    const leftHip = new THREE.Mesh(hipGeometry.clone(), accentMaterial.clone());
    leftLegPivot.add(leftHip);

    const leftUpperLeg = new THREE.Mesh(upperLegGeometry.clone(), limbMaterial.clone());
    leftUpperLeg.position.y = -0.32;
    game.player.leftUpperLeg = leftUpperLeg;
    leftLegPivot.add(leftUpperLeg);

    const leftKnee = new THREE.Mesh(kneeGeometry.clone(), accentMaterial.clone());
    leftKnee.position.y = -0.58;
    leftUpperLeg.add(leftKnee);

    const leftKneePivot = new THREE.Group();
    leftKneePivot.position.y = -0.58;
    leftUpperLeg.add(leftKneePivot);
    game.player.leftKneePivot = leftKneePivot;

    const leftLowerLeg = new THREE.Mesh(lowerLegGeometry.clone(), limbMaterial.clone());
    leftLowerLeg.position.y = -0.28;
    game.player.leftLowerLeg = leftLowerLeg;
    leftKneePivot.add(leftLowerLeg);

    const leftAnklePivot = new THREE.Group();
    leftAnklePivot.position.y = -0.5;
    leftLowerLeg.add(leftAnklePivot);
    game.player.leftAnklePivot = leftAnklePivot;

    const leftFoot = new THREE.Mesh(footGeometry.clone(), accentMaterial.clone());
    leftFoot.rotation.x = Math.PI / 2;
    leftFoot.position.set(0, -0.05, 0.1);
    game.player.leftFoot = leftFoot;
    leftAnklePivot.add(leftFoot);

    // Animation state
    game.player.animTime = 0;
    game.player.walkCycle = 0;

    // Player properties
    game.player.velocity = new THREE.Vector3();
    game.player.rotation.y = 0;
    game.player.health = game.stats.health;
    game.player.isAttacking = false;
    game.player.attackCooldown = 0;
    // Separate state for each arm - allows simultaneous attacks!
    game.player.rightArmCooldown = 0;
    game.player.leftArmCooldown = 0;
    game.player.isAttackingRight = false;
    game.player.isAttackingLeft = false;
    game.player.rightSwingProgress = 0;
    game.player.leftSwingProgress = 0;
    // Kick state
    game.player.isKicking = false;
    game.player.kickCooldown = 0;
    game.player.kickProgress = 0;
    game.player.isDashing = false;
    game.player.dashTime = 0;
    game.player.swingDirection = 1; // 1 = right arm, -1 = left arm
    game.player.swingProgress = 0; // 0 to 1 during swing animation

    // Speed lines for dashing (initially hidden)
    game.player.speedLines = [];
    for (let i = 0; i < 5; i++) {
        const lineGeometry = new THREE.ConeGeometry(0.05, 1.5, 3);
        const lineMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.6
        });
        const line = new THREE.Mesh(lineGeometry, lineMaterial);
        line.visible = false;
        game.player.speedLines.push(line);
        game.player.add(line);
    }

    game.scene.add(game.player);
    console.log('Low-poly player added to scene');
}

// Spawn enemy with hierarchical body parts - LOW POLY STYLE
function spawnEnemy() {
    // Main container
    const enemy = new THREE.Group();

    // LOW POLY MATERIALS - Flat shading, red/orange demonic colors
    const torsoMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b2500,
        flatShading: true,
        metalness: 0.3,
        roughness: 0.7
    });
    const limbMaterial = new THREE.MeshStandardMaterial({
        color: 0x6b1c00,
        flatShading: true,
        metalness: 0.2,
        roughness: 0.8
    });
    const accentMaterial = new THREE.MeshStandardMaterial({
        color: 0x4a1200,
        flatShading: true,
        metalness: 0.4,
        roughness: 0.6
    });
    const eyeMaterial = new THREE.MeshStandardMaterial({
        color: 0xffff00,
        emissive: 0xffff00,
        emissiveIntensity: 1.0,
        flatShading: true
    });

    // TORSO - Angular demonic chest
    const torsoGeometry = new THREE.CylinderGeometry(0.25, 0.4, 0.9, 5);
    const torso = new THREE.Mesh(torsoGeometry, torsoMaterial);
    torso.position.y = 1.3;
    enemy.torso = torso;
    enemy.add(torso);

    // Chest spikes
    const spikeGeometry = new THREE.ConeGeometry(0.08, 0.25, 4);
    const spikeMaterial = new THREE.MeshStandardMaterial({
        color: 0x3d0c00,
        flatShading: true,
        metalness: 0.5
    });
    const chestSpike1 = new THREE.Mesh(spikeGeometry, spikeMaterial);
    chestSpike1.position.set(0.15, 0.2, -0.25);
    chestSpike1.rotation.x = -0.5;
    torso.add(chestSpike1);
    const chestSpike2 = new THREE.Mesh(spikeGeometry, spikeMaterial);
    chestSpike2.position.set(-0.15, 0.2, -0.25);
    chestSpike2.rotation.x = -0.5;
    torso.add(chestSpike2);

    // HEAD - Angular demon skull with horns
    const headGeometry = new THREE.DodecahedronGeometry(0.28, 0);
    const headMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b2500,
        flatShading: true,
        metalness: 0.3,
        roughness: 0.7
    });
    const head = new THREE.Mesh(headGeometry, headMaterial);
    head.position.y = 0.7;
    head.scale.set(1, 1.2, 1);
    enemy.head = head;
    torso.add(head);

    // Horns
    const hornGeometry = new THREE.ConeGeometry(0.06, 0.35, 4);
    const hornMaterial = new THREE.MeshStandardMaterial({
        color: 0x2a0a00,
        flatShading: true,
        metalness: 0.6
    });
    const leftHorn = new THREE.Mesh(hornGeometry, hornMaterial);
    leftHorn.position.set(-0.2, 0.25, 0);
    leftHorn.rotation.z = 0.4;
    head.add(leftHorn);
    const rightHorn = new THREE.Mesh(hornGeometry, hornMaterial);
    rightHorn.position.set(0.2, 0.25, 0);
    rightHorn.rotation.z = -0.4;
    head.add(rightHorn);

    // Glowing eyes
    const eyeGeoL = new THREE.OctahedronGeometry(0.06, 0);
    const leftEye = new THREE.Mesh(eyeGeoL, eyeMaterial);
    leftEye.position.set(-0.12, 0.05, -0.22);
    enemy.eye = leftEye;
    head.add(leftEye);
    const rightEye = new THREE.Mesh(eyeGeoL.clone(), eyeMaterial.clone());
    rightEye.position.set(0.12, 0.05, -0.22);

// Update player
function updatePlayer(delta) {
    if (!game.player || delta > 0.1) return;
    
    if (game.player.attackCooldown > 0) {
        game.player.attackCooldown -= delta;
    }
    if (game.player.rightArmCooldown > 0) {
        game.player.rightArmCooldown -= delta;
    }
    if (game.player.leftArmCooldown > 0) {
        game.player.leftArmCooldown -= delta;
    }
    if (game.player.kickCooldown > 0) {
        game.player.kickCooldown -= delta;
    }

    if (game.player.dashTime > 0) {
        game.player.dashTime -= delta;
        if (game.player.dashTime <= 0) {
            game.player.isDashing = false;
        }
    }
    
    for (let ability in game.abilities) {
        if (game.abilities[ability].cooldown > 0) {
            game.abilities[ability].cooldown -= delta;
        }
    }
    
    // Energy regeneration system
    if (game.stats.energy <= 0) {
        // Out of energy - rapid recharge but can't move
        game.stats.energy = Math.min(game.stats.maxEnergy, game.stats.energy + 50 * delta);
    } else if (game.stats.energy < game.stats.maxEnergy) {
        // Normal slow regeneration
        game.stats.energy = Math.min(game.stats.maxEnergy, game.stats.energy + 3 * delta);
    }
    
    // Can't do anything with no energy
    if (game.stats.energy <= 0) {
        return;
    }
    
    const moveSpeed = game.player.isDashing ? game.stats.speed * 3 : game.stats.speed;
    const rotateSpeed = 3;
    let isMoving = false;
    let isMovingForward = false;
    let isMovingBackward = false;
    let isRotating = false;
    
    // A/D rotates player (no energy cost)
    if (game.keys['a'] || game.keys['arrowleft']) {
        game.player.rotation.y += rotateSpeed * delta;
        isRotating = true;
    }
    if (game.keys['d'] || game.keys['arrowright']) {
        game.player.rotation.y -= rotateSpeed * delta;
        isRotating = true;
    }
    
    // W/S moves forward/backward (costs energy)
    if (game.keys['w'] || game.keys['arrowup']) {
        game.player.position.x -= Math.sin(game.player.rotation.y) * moveSpeed * delta;
        game.player.position.z -= Math.cos(game.player.rotation.y) * moveSpeed * delta;
        isMoving = true;
        isMovingForward = true;
    }
    if (game.keys['s'] || game.keys['arrowdown']) {
        game.player.position.x += Math.sin(game.player.rotation.y) * moveSpeed * delta;
        game.player.position.z += Math.cos(game.player.rotation.y) * moveSpeed * delta;
        isMoving = true;
        isMovingBackward = true;
    }
    
    // Walking drains energy (1 per 5 seconds = 0.2 per second)
    if (isMoving && !game.player.isDashing) {
        game.stats.energy -= 0.2 * delta;
        if (game.stats.energy < 0) game.stats.energy = 0;
    }
    
    // Dash ability (can use anytime if sufficient energy)
    if (game.keys[' '] && !game.player.isDashing && game.stats.energy >= 20) {
        game.player.isDashing = true;
        game.player.dashTime = 0.3;
        game.abilities.dash.cooldown = game.abilities.dash.maxCooldown;
        game.stats.energy -= 20;
    }
    
    // Block ability (instant toggle - hold Shift to block, release to unblock)
    if (game.keys['shift']) {
        if (!game.abilities.block.active) {
            game.abilities.block.active = true;
            // Change torso color to blue when blocking
            if (game.player.torso) {
                game.player.torso.material.emissive.setHex(0x0000ff);
            }
        }
    } else {
        if (game.abilities.block.active) {
            game.abilities.block.active = false;
            // No cooldown - can block again immediately
            // Change torso back to green
            if (game.player.torso) {
                game.player.torso.material.emissive.setHex(0x00ff00);
            }
        }
    }
    
    game.player.position.x = Math.max(-45, Math.min(45, game.player.position.x));
    game.player.position.z = Math.max(-45, Math.min(45, game.player.position.z));
    
    // Camera always behind player
    const cameraDistance = 10;
    const cameraHeight = 8;
    
    const targetCamX = game.player.position.x + Math.sin(game.player.rotation.y) * cameraDistance;
    const targetCamZ = game.player.position.z + Math.cos(game.player.rotation.y) * cameraDistance;
    const targetCamY = game.player.position.y + cameraHeight;
    
    game.camera.position.x += (targetCamX - game.camera.position.x) * 0.1;
    game.camera.position.z += (targetCamZ - game.camera.position.z) * 0.1;
    game.camera.position.y += (targetCamY - game.camera.position.y) * 0.1;
    game.camera.lookAt(game.player.position);
    
    // Animate body parts
    animatePlayer(delta, isMovingForward, isMovingBackward, isRotating);
}

// Animate player body parts (using hierarchical pivots)
function animatePlayer(delta, isMovingForward, isMovingBackward, isRotating) {
    if (!game.player) return;

    game.player.animTime += delta;

    const isBlocking = game.abilities.block.active;
    const isDashing = game.player.isDashing;
    const isAttacking = game.player.isAttacking;
    const isKicking = game.player.isKicking;

    const walkSpeed = 4;
    const walkAmplitude = 0.4;

    // KICKING ANIMATION - powerful knockback kick
    if (isKicking) {
        const kickProg = game.player.kickProgress;
        const kickExtend = kickProg < 0.4 ? kickProg * 2.5 : 1; // Quick extend

        // Right leg kicks forward
        game.player.rightLegPivot.rotation.x = -0.3 + kickExtend * 1.8; // Leg swings forward
        game.player.rightKneePivot.rotation.x = 0.3 - kickExtend * 0.3; // Knee straightens

        // Left leg planted
        game.player.leftLegPivot.rotation.x = 0.2;
        game.player.leftKneePivot.rotation.x = 0.3;

        // Arms stay in boxer stance but lean back
        game.player.rightArmPivot.rotation.x = 0.3;
        game.player.leftArmPivot.rotation.x = 0.3;
        game.player.rightArmPivot.rotation.z = 0;
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = 2.0;
        game.player.leftElbowPivot.rotation.x = 2.0;

        // Torso leans back for balance
        game.player.torso.rotation.x = -0.3 * kickExtend;
        game.player.torso.rotation.y = 0;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // DASHING ANIMATION
    else if (isDashing) {
        // Arms stretched back (rotate shoulder pivots)
        game.player.rightArmPivot.rotation.x = 1.2;
        game.player.leftArmPivot.rotation.x = 1.2;
        game.player.rightElbowPivot.rotation.x = 0.3;
        game.player.leftElbowPivot.rotation.x = 0.3;

        // Torso leans forward
        game.player.torso.rotation.x = 0.3;

        // Fast leg movement
        const dashCycle = Math.sin(game.player.animTime * 15);
        game.player.rightLegPivot.rotation.x = dashCycle * 0.8;
        game.player.leftLegPivot.rotation.x = -dashCycle * 0.8;
        game.player.rightKneePivot.rotation.x = Math.max(0, -dashCycle) * 0.6;
        game.player.leftKneePivot.rotation.x = Math.max(0, dashCycle) * 0.6;

        // Speed lines
        for (let i = 0; i < game.player.speedLines.length; i++) {
            const line = game.player.speedLines[i];
            line.visible = true;
            line.position.set(
                (Math.random() - 0.5) * 0.5,
                1 + (Math.random() - 0.5) * 0.8,
                0.5 + i * 0.3
            );
        }

        // If attacking while dashing, dual thrust forward
        if (isAttacking) {
            // Both arms thrust forward
            game.player.rightArmPivot.rotation.x = Math.PI / 2;
            game.player.rightArmPivot.rotation.z = 0.3;
            game.player.rightElbowPivot.rotation.x = 0;
            game.player.rightWristPivot.rotation.x = 0;

            game.player.leftArmPivot.rotation.x = Math.PI / 2;
            game.player.leftArmPivot.rotation.z = -0.3;
            game.player.leftElbowPivot.rotation.x = 0;
            game.player.leftWristPivot.rotation.x = 0;
        }
    }
    // ATTACKING ANIMATION - Both arms can punch simultaneously!
    else if (isAttacking) {
        const rightProg = game.player.rightSwingProgress;
        const leftProg = game.player.leftSwingProgress;
        const isAttackingRight = game.player.isAttackingRight;
        const isAttackingLeft = game.player.isAttackingLeft;

        // Right arm punch calculation
        const rightPunch = Math.min(1, rightProg / 0.8);
        const rightExtend = rightPunch < 0.5 ? rightPunch * 2 : 1;

        // Left arm punch calculation
        const leftPunch = Math.min(1, leftProg / 0.8);
        const leftExtend = leftPunch < 0.5 ? leftPunch * 2 : 1;

        // RIGHT ARM - punching or ready
        if (isAttackingRight) {
            game.player.rightArmPivot.rotation.x = 0.3 + rightExtend * 1.2;
            game.player.rightArmPivot.rotation.z = -0.2;
            game.player.rightArmPivot.rotation.y = 0;
            game.player.rightElbowPivot.rotation.x = 2.0 - rightExtend * 2.0;
            game.player.rightWristPivot.rotation.set(0, 0, 0);

            if (game.player.rightFistTrail) {
                const trailOpacity = rightExtend * (1 - rightPunch * 0.5) * 0.8;
                game.player.rightFistTrail.material.opacity = trailOpacity;
            }
        } else {
            // Ready position
            game.player.rightArmPivot.rotation.x = 0.4;
            game.player.rightArmPivot.rotation.z = 0;
            game.player.rightElbowPivot.rotation.x = 2.0;
            game.player.rightWristPivot.rotation.set(0, 0, 0);
            if (game.player.rightFistTrail) {
                game.player.rightFistTrail.material.opacity = 0;
            }
        }

        // LEFT ARM - punching or ready
        if (isAttackingLeft) {
            game.player.leftArmPivot.rotation.x = 0.3 + leftExtend * 1.2;
            game.player.leftArmPivot.rotation.z = 0.2;
            game.player.leftArmPivot.rotation.y = 0;
            game.player.leftElbowPivot.rotation.x = 2.0 - leftExtend * 2.0;
            game.player.leftWristPivot.rotation.set(0, 0, 0);

            if (game.player.leftFistTrail) {
                const trailOpacity = leftExtend * (1 - leftPunch * 0.5) * 0.8;
                game.player.leftFistTrail.material.opacity = trailOpacity;
            }
        } else {
            // Ready position
            game.player.leftArmPivot.rotation.x = 0.4;
            game.player.leftArmPivot.rotation.z = 0;
            game.player.leftElbowPivot.rotation.x = 2.0;
            game.player.leftWristPivot.rotation.set(0, 0, 0);
            if (game.player.leftFistTrail) {
                game.player.leftFistTrail.material.opacity = 0;
            }
        }

        // Torso twist based on which arm(s) are punching
        if (isAttackingRight && isAttackingLeft) {
            game.player.torso.rotation.y = 0; // Both punching - stay centered
        } else if (isAttackingRight) {
            game.player.torso.rotation.y = -0.2 * rightExtend;
        } else if (isAttackingLeft) {
            game.player.torso.rotation.y = 0.2 * leftExtend;
        }

        // Torso leans forward when punching
        const maxExtend = Math.max(rightExtend, leftExtend);
        game.player.torso.rotation.x = 0.1 * maxExtend;

        // Legs stable, slight lunge based on which arm(s) are punching
        game.player.rightLegPivot.rotation.x = isAttackingRight ? 0.15 * rightExtend : 0;
        game.player.leftLegPivot.rotation.x = isAttackingLeft ? 0.15 * leftExtend : 0;
        game.player.rightKneePivot.rotation.x = 0.1;
        game.player.leftKneePivot.rotation.x = 0.1;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // BLOCKING ANIMATION - Fists raised in tight guard
    else if (isBlocking) {
        // Arms crossed in front, forearms up
        game.player.rightArmPivot.rotation.x = 0.6;
        game.player.rightArmPivot.rotation.z = -0.3;
        game.player.leftArmPivot.rotation.x = 0.6;
        game.player.leftArmPivot.rotation.z = 0.3;
        game.player.rightElbowPivot.rotation.x = 2.2;
        game.player.leftElbowPivot.rotation.x = 2.2;
        game.player.rightWristPivot.rotation.x = 0;
        game.player.leftWristPivot.rotation.x = 0;

        // Legs still animate if walking
        if (isMovingForward || isMovingBackward) {
            const walkCycle = Math.sin(game.player.animTime * walkSpeed);
            game.player.rightLegPivot.rotation.x = walkCycle * walkAmplitude;
            game.player.leftLegPivot.rotation.x = -walkCycle * walkAmplitude;
            game.player.rightKneePivot.rotation.x = Math.max(0, -walkCycle) * 0.5;
            game.player.leftKneePivot.rotation.x = Math.max(0, walkCycle) * 0.5;
        } else {
            game.player.rightLegPivot.rotation.x = 0;
            game.player.leftLegPivot.rotation.x = 0;
            game.player.rightKneePivot.rotation.x = 0;
            game.player.leftKneePivot.rotation.x = 0;
        }

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // MOVING BACKWARD - boxer stance maintained
    else if (isMovingBackward) {
        const walkCycle = Math.sin(game.player.animTime * walkSpeed);
        const bobCycle = Math.sin(game.player.animTime * 4);

        // Boxer stance - upper arms straight forward, forearms bent up
        game.player.rightArmPivot.rotation.x = 0.4 + bobCycle * 0.05;
        game.player.leftArmPivot.rotation.x = 0.4 + bobCycle * 0.05;
        game.player.rightArmPivot.rotation.z = 0;
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = 2.0;
        game.player.leftElbowPivot.rotation.x = 2.0;
        game.player.rightWristPivot.rotation.x = 0;
        game.player.leftWristPivot.rotation.x = 0;

        // Legs walk backward
        game.player.rightLegPivot.rotation.x = -walkCycle * walkAmplitude;
        game.player.leftLegPivot.rotation.x = walkCycle * walkAmplitude;
        game.player.rightKneePivot.rotation.x = Math.max(0, walkCycle) * 0.5;
        game.player.leftKneePivot.rotation.x = Math.max(0, -walkCycle) * 0.5;

        // Torso slight bob
        game.player.torso.rotation.x = 0;
        game.player.torso.position.y = 1.5 + Math.abs(walkCycle) * 0.03;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // NORMAL WALKING - boxer stance maintained
    else if (isMovingForward) {
        const walkCycle = Math.sin(game.player.animTime * walkSpeed);
        const bobCycle = Math.sin(game.player.animTime * 4);

        // Boxer stance - upper arms straight forward, forearms bent up
        game.player.rightArmPivot.rotation.x = 0.4 + bobCycle * 0.08;
        game.player.leftArmPivot.rotation.x = 0.4 - bobCycle * 0.08;
        game.player.rightArmPivot.rotation.z = 0;
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = 2.0;
        game.player.leftElbowPivot.rotation.x = 2.0;
        game.player.rightWristPivot.rotation.x = 0;
        game.player.leftWristPivot.rotation.x = 0;

        // Legs walk (rotate hip pivots)
        game.player.rightLegPivot.rotation.x = walkCycle * walkAmplitude;
        game.player.leftLegPivot.rotation.x = -walkCycle * walkAmplitude;
        game.player.rightKneePivot.rotation.x = Math.max(0, -walkCycle) * 0.5;
        game.player.leftKneePivot.rotation.x = Math.max(0, walkCycle) * 0.5;

        // Torso slight bob
        game.player.torso.position.y = 1.5 + Math.abs(walkCycle) * 0.04;
        game.player.torso.rotation.z = 0;
        game.player.torso.rotation.x = 0.05;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // ROTATING (turning) - boxer stance maintained
    else if (isRotating) {
        const bobCycle = Math.sin(game.player.animTime * 4);

        // Boxer stance - upper arms straight forward, forearms bent up
        game.player.rightArmPivot.rotation.x = 0.4 + bobCycle * 0.05;
        game.player.leftArmPivot.rotation.x = 0.4 + bobCycle * 0.05;
        game.player.rightArmPivot.rotation.z = 0;
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = 2.0;
        game.player.leftElbowPivot.rotation.x = 2.0;
        game.player.rightWristPivot.rotation.x = 0;
        game.player.leftWristPivot.rotation.x = 0;

        // Slight lean
        game.player.torso.rotation.z = 0;

        // Reset legs
        game.player.rightLegPivot.rotation.x = 0;
        game.player.leftLegPivot.rotation.x = 0;
        game.player.rightKneePivot.rotation.x = 0;
        game.player.leftKneePivot.rotation.x = 0;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // IDLE - Boxer fighting stance with bob and weave
    else {
        // Boxer bob and weave
        const bobCycle = Math.sin(game.player.animTime * 3);
        const swayX = Math.sin(game.player.animTime * 1.5) * 0.03;
        game.player.torso.position.y = 1.5 + bobCycle * 0.03;
        game.player.torso.rotation.z = swayX;

        // Hide fist trails when idle
        if (game.player.rightFistTrail) game.player.rightFistTrail.material.opacity = 0;
        if (game.player.leftFistTrail) game.player.leftFistTrail.material.opacity = 0;

        // Boxer stance - upper arms straight forward, forearms bent up
        game.player.rightArmPivot.rotation.x = 0.4 + bobCycle * 0.06;
        game.player.leftArmPivot.rotation.x = 0.4 - bobCycle * 0.06;
        game.player.rightArmPivot.rotation.z = 0;
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = 2.0;
        game.player.leftElbowPivot.rotation.x = 2.0;
        game.player.rightWristPivot.rotation.x = 0;
        game.player.leftWristPivot.rotation.x = 0;

        // Legs slightly bent, ready stance
        game.player.rightLegPivot.rotation.x = 0.1;
        game.player.leftLegPivot.rotation.x = 0.1;
        game.player.rightKneePivot.rotation.x = 0.15;
        game.player.leftKneePivot.rotation.x = 0.15;
        game.player.rightAnklePivot.rotation.x = 0;
        game.player.leftAnklePivot.rotation.x = 0;

        // Torso slightly forward
        game.player.torso.rotation.x = 0.05;

        game.player.speedLines.forEach(line => line.visible = false);
    }
}

// Animate enemy body parts (using hierarchical pivots)
function animateEnemy(enemy, delta) {
    if (!enemy || !enemy.torso) return;

    enemy.animTime += delta;

    const walkSpeed = 6;
    const walkAmplitude = 0.5;

    // ATTACKING ANIMATION (smooth interpolation)
    if (enemy.isAttacking) {
        enemy.attackAnimTime += delta;

        // Animation phases: wind-up (0-0.15s), thrust (0.15-0.35s), hold (0.35-0.5s)
        const t = enemy.attackAnimTime;
        let attackProgress;

        if (t < 0.15) {
            // Wind-up phase: arm pulls back slightly
            attackProgress = -0.3 * (t / 0.15);
        } else if (t < 0.35) {
            // Thrust phase: smooth interpolation from wind-up to full extension
            const thrustT = (t - 0.15) / 0.2;
            attackProgress = -0.3 + (1.8) * thrustT; // From -0.3 to 1.5
        } else {
            // Hold phase: full extension
            attackProgress = 1.5;
        }

        // Right arm thrusts forward smoothly
        enemy.rightArmPivot.rotation.x = attackProgress;
        enemy.rightElbowPivot.rotation.x = Math.max(0, attackProgress * 0.2);

        // Torso leans forward with the thrust
        enemy.torso.rotation.x = Math.max(0, attackProgress * 0.2);

        // Left arm stays back for balance
        enemy.leftArmPivot.rotation.x = -0.3 - Math.max(0, attackProgress * 0.15);

        // Legs brace during thrust
        const braceAmount = Math.max(0, attackProgress / 1.5);
        enemy.rightLegPivot.rotation.x = -0.2 * braceAmount;
        enemy.leftLegPivot.rotation.x = 0.2 * braceAmount;

        // Eye pulses bright during attack
        if (enemy.eye) {
            enemy.eye.material.emissiveIntensity = 1.5 + Math.sin(t * 20) * 0.5;
        }

        // Attack animation duration
        if (t > 0.5) {
            enemy.isAttacking = false;
            enemy.attackAnimTime = 0;
        }
    }
    // WALKING ANIMATION
    else if (enemy.isWalking) {
        const walkCycle = Math.sin(enemy.animTime * walkSpeed);

        // Arms swing opposite to legs (rotate pivots)
        enemy.rightArmPivot.rotation.x = -walkCycle * 0.5;
        enemy.leftArmPivot.rotation.x = walkCycle * 0.5;
        // Slight elbow bend while walking
        enemy.rightElbowPivot.rotation.x = -0.2;
        enemy.leftElbowPivot.rotation.x = -0.2;

        // Legs walk (rotate hip pivots)
        enemy.rightLegPivot.rotation.x = walkCycle * walkAmplitude;
        enemy.leftLegPivot.rotation.x = -walkCycle * walkAmplitude;
        // Knee bends when leg swings back
        enemy.rightKneePivot.rotation.x = Math.max(0, -walkCycle) * 0.6;
        enemy.leftKneePivot.rotation.x = Math.max(0, walkCycle) * 0.6;

        // Torso bob and sway
        enemy.torso.position.y = 1.3 + Math.abs(walkCycle) * 0.04;
        enemy.torso.rotation.z = walkCycle * 0.04;
        enemy.torso.rotation.x = 0.1;

        // Eye normal intensity
        if (enemy.eye) {
            enemy.eye.material.emissiveIntensity = 1.0;
        }
    }
    // IDLE ANIMATION
    else {
        const breathCycle = Math.sin(enemy.animTime * 2);
        const lookCycle = Math.sin(enemy.animTime * 0.5);

        // Gentle breathing
        enemy.torso.position.y = 1.3 + breathCycle * 0.02;
        enemy.torso.rotation.x = 0;
        enemy.torso.rotation.z = 0;

        // Arms at rest with slight sway
        enemy.rightArmPivot.rotation.x = breathCycle * 0.05;
        enemy.leftArmPivot.rotation.x = -breathCycle * 0.05;
        enemy.rightElbowPivot.rotation.x = 0;
        enemy.leftElbowPivot.rotation.x = 0;

        // Legs at rest
        enemy.rightLegPivot.rotation.x = 0;
        enemy.leftLegPivot.rotation.x = 0;
        enemy.rightKneePivot.rotation.x = 0;
        enemy.leftKneePivot.rotation.x = 0;

        // Head looks around slightly
        enemy.head.rotation.y = lookCycle * 0.2;

        // Eye pulses gently
        if (enemy.eye) {
            enemy.eye.material.emissiveIntensity = 0.8 + breathCycle * 0.2;
        }
    }
}

// Update enemies
function updateEnemies(delta) {
    for (let i = game.enemies.length - 1; i >= 0; i--) {
        const enemy = game.enemies[i];

        if (!enemy.isActive) continue;

        if (enemy.attackCooldown > 0) {
            enemy.attackCooldown -= delta;
        }

        const distanceToPlayer = enemy.position.distanceTo(game.player.position);

        // Reset walking state
        enemy.isWalking = false;

        if (distanceToPlayer < enemy.detectionRange) {
            if (distanceToPlayer > enemy.attackRange) {
                // Walking towards player
                enemy.isWalking = true;

                const direction = new THREE.Vector3()
                    .subVectors(game.player.position, enemy.position)
                    .normalize();

                enemy.position.x += direction.x * enemy.speed * delta;
                enemy.position.z += direction.z * enemy.speed * delta;

                // Face the player (only rotate Y axis)
                // Model's face is at -Z, so add PI to face toward player
                const targetAngle = Math.atan2(
                    game.player.position.x - enemy.position.x,
                    game.player.position.z - enemy.position.z
                );
                enemy.rotation.y = targetAngle + Math.PI;
            } else {
                // In attack range
                if (enemy.attackCooldown <= 0 && !enemy.isAttacking) {
                    enemy.isAttacking = true;
                    enemy.attackAnimTime = 0;
                    attackPlayer(enemy);
                    enemy.attackCooldown = 1.5;
                }
            }
        }

        // Animate the enemy
        animateEnemy(enemy, delta);

        // Death
        if (enemy.health <= 0) {
            game.scene.remove(enemy);
            game.enemies.splice(i, 1);
            setTimeout(() => spawnEnemy(), 2000);
        }
    }
}

// Enemy attacks player
function attackPlayer(enemy) {
    const damage = game.abilities.block.active ? 
        Math.max(1, enemy.attackDamage - game.stats.defense) : 
        enemy.attackDamage;
    
    game.stats.health -= damage;
    
    // Flash effect on torso
    if (game.player.torso) {
        const originalEmissive = game.player.torso.material.emissive.getHex();
        game.player.torso.material.emissive.setHex(0xff0000);
        setTimeout(() => {
            game.player.torso.material.emissive.setHex(originalEmissive);
        }, 100);
    }
    
    if (game.stats.health <= 0) {
        respawnPlayer();
    }
}

// Player attack - useRightArm: true = right arm (right click), false = left arm (left click)
function playerAttack(useRightArm) {
    // Check the specific arm's cooldown
    if (useRightArm) {
        if (game.player.rightArmCooldown > 0) return;
    } else {
        if (game.player.leftArmCooldown > 0) return;
    }

    // Need at least 2 energy to attack
    if (game.stats.energy < 2) return;

    // Set attack state for specific arm (allows both to attack simultaneously!)
    if (useRightArm) {
        game.player.isAttackingRight = true;
        game.player.rightArmCooldown = 0.5;
        game.player.rightSwingProgress = 0;
    } else {
        game.player.isAttackingLeft = true;
        game.player.leftArmCooldown = 0.5;
        game.player.leftSwingProgress = 0;
    }

    // Legacy flag for compatibility
    game.player.isAttacking = true;
    game.player.swingDirection = useRightArm ? 1 : -1;

    // Attacking costs trivial energy (2 energy)
    game.stats.energy -= 2;
    if (game.stats.energy < 0) game.stats.energy = 0;

    // Animate the swing over time (0 to 1 over 250ms)
    const swingDuration = 250;
    const swingStart = Date.now();

    function animateSwing() {
        const elapsed = Date.now() - swingStart;
        const progress = Math.min(1, elapsed / swingDuration);

        // Update the specific arm's progress
        if (useRightArm) {
            game.player.rightSwingProgress = progress;
        } else {
            game.player.leftSwingProgress = progress;
        }

        if (elapsed < swingDuration) {
            requestAnimationFrame(animateSwing);
        } else {
            // Swing complete for this arm
            if (useRightArm) {
                game.player.isAttackingRight = false;
                game.player.rightSwingProgress = 0;
            } else {
                game.player.isAttackingLeft = false;
                game.player.leftSwingProgress = 0;
            }
            // Only clear isAttacking if both arms are done
            if (!game.player.isAttackingRight && !game.player.isAttackingLeft) {
                game.player.isAttacking = false;
            }
        }
    }
    animateSwing();

    // DIRECTIONAL HITBOX - wider arc for sword swing
    const attackRange = 2.8; // Sword reach distance (increased)
    const attackAngle = Math.PI * 0.8; // 144 degree arc (72 degrees each side)

    // Get player's forward direction (based on rotation)
    const playerForward = new THREE.Vector3(
        -Math.sin(game.player.rotation.y),
        0,
        -Math.cos(game.player.rotation.y)
    );

    for (let enemy of game.enemies) {
        if (!enemy.isActive) continue;

        const distance = game.player.position.distanceTo(enemy.position);
        if (distance > attackRange) continue; // Too far

        // Get direction to enemy
        const toEnemy = new THREE.Vector3()
            .subVectors(enemy.position, game.player.position)
            .normalize();
        toEnemy.y = 0; // Only consider horizontal direction

        // Check angle between player forward and direction to enemy
        const dot = playerForward.dot(toEnemy);
        const angleToEnemy = Math.acos(Math.max(-1, Math.min(1, dot)));

        // Only hit if enemy is within the attack arc (in front of player)
        if (angleToEnemy < attackAngle / 2) {
            const damage = game.stats.attack;
            enemy.health -= damage;

            // Electric shock effect and chain lightning!
            applyElectricShock(enemy, damage, [enemy]);

            // Knockback in the direction of the hit
            enemy.position.x += toEnemy.x * 2;
            enemy.position.z += toEnemy.z * 2;
        }
    }
}

// Apply electric shock effect to enemy and chain to nearby enemies
function applyElectricShock(enemy, baseDamage, alreadyHit, chainDepth = 0) {
    const maxChainDepth = 4; // Maximum chain jumps
    const chainRange = 3.5; // Range to find next target
    const chainDamageMultiplier = 0.5; // Each chain does 50% of previous damage

    // Electric glow effect on enemy
    if (enemy.bodyMaterial) {
        const originalColor = enemy.bodyMaterial.color.getHex();
        const originalEmissive = enemy.bodyMaterial.emissive.getHex();

        // Bright cyan electric glow
        enemy.bodyMaterial.emissive.setHex(0x00ffff);
        enemy.bodyMaterial.emissiveIntensity = 2.0;
        enemy.bodyMaterial.color.setHex(0xaaffff);

        // Flicker effect
        let flickerCount = 0;
        const flickerInterval = setInterval(() => {
            flickerCount++;
            enemy.bodyMaterial.emissiveIntensity = flickerCount % 2 === 0 ? 2.0 : 0.5;
            if (flickerCount >= 6) {
                clearInterval(flickerInterval);
                if (enemy.bodyMaterial) {
                    enemy.bodyMaterial.emissive.setHex(originalEmissive);
                    enemy.bodyMaterial.emissiveIntensity = 0.5;
                    enemy.bodyMaterial.color.setHex(originalColor);
                }
            }
        }, 50);
    }

    // Create lightning bolt visual to this enemy (if chained)
    if (chainDepth > 0 && alreadyHit.length >= 2) {
        const prevEnemy = alreadyHit[alreadyHit.length - 2];
        createLightningBolt(prevEnemy.position, enemy.position);
    }

    // Try to chain to nearby enemies
    if (chainDepth < maxChainDepth) {
        let closestEnemy = null;
        let closestDist = chainRange;

        for (let otherEnemy of game.enemies) {
            if (!otherEnemy.isActive) continue;
            if (alreadyHit.includes(otherEnemy)) continue;

            const dist = enemy.position.distanceTo(otherEnemy.position);
            if (dist < closestDist) {
                closestDist = dist;
                closestEnemy = otherEnemy;
            }
        }

        // Chain to closest enemy
        if (closestEnemy) {
            const chainDamage = Math.floor(baseDamage * chainDamageMultiplier);
            if (chainDamage > 0) {
                alreadyHit.push(closestEnemy);
                closestEnemy.health -= chainDamage;

                // Small delay for visual chain effect
                setTimeout(() => {
                    applyElectricShock(closestEnemy, chainDamage, alreadyHit, chainDepth + 1);
                }, 80);
            }
        }
    }
}

// Create a visual lightning bolt between two points
function createLightningBolt(startPos, endPos) {
    const points = [];
    const segments = 5;

    for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const x = startPos.x + (endPos.x - startPos.x) * t;
        const y = (startPos.y + 1) + (endPos.y + 1 - startPos.y - 1) * t;
        const z = startPos.z + (endPos.z - startPos.z) * t;

        // Add randomness to middle points for jagged lightning look
        if (i > 0 && i < segments) {
            points.push(new THREE.Vector3(
                x + (Math.random() - 0.5) * 0.5,
                y + (Math.random() - 0.5) * 0.3,
                z + (Math.random() - 0.5) * 0.5
            ));
        } else {
            points.push(new THREE.Vector3(x, y, z));
        }
    }

    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending
    });

    const lightning = new THREE.Line(geometry, material);
    game.scene.add(lightning);

    // Fade out and remove
    let opacity = 1.0;
    const fadeInterval = setInterval(() => {
        opacity -= 0.15;
        material.opacity = opacity;
        if (opacity <= 0) {
            clearInterval(fadeInterval);
            game.scene.remove(lightning);
            geometry.dispose();
            material.dispose();
        }
    }, 30);
}

// Player kick - middle mouse button, less damage but huge knockback
function playerKick() {
    if (game.player.kickCooldown > 0 || game.player.isKicking) return;

    // Need at least 3 energy to kick
    if (game.stats.energy < 3) return;

    game.player.isKicking = true;
    game.player.kickCooldown = 0.7; // Longer cooldown than punch
    game.player.kickProgress = 0;

    // Kicking costs more energy
    game.stats.energy -= 3;
    if (game.stats.energy < 0) game.stats.energy = 0;

    // Animate the kick
    const kickDuration = 300;
    const kickStart = Date.now();

    function animateKick() {
        const elapsed = Date.now() - kickStart;
        game.player.kickProgress = Math.min(1, elapsed / kickDuration);

        if (elapsed < kickDuration) {
            requestAnimationFrame(animateKick);
        } else {
            game.player.isKicking = false;
            game.player.kickProgress = 0;
        }
    }
    animateKick();

    // Kick hitbox - narrower but still forward
    const kickRange = 2.5;
    const kickAngle = Math.PI * 0.5; // 90 degree arc

    const playerForward = new THREE.Vector3(
        -Math.sin(game.player.rotation.y),
        0,
        -Math.cos(game.player.rotation.y)
    );

    for (let enemy of game.enemies) {
        if (!enemy.isActive) continue;

        const distance = game.player.position.distanceTo(enemy.position);
        if (distance > kickRange) continue;

        const toEnemy = new THREE.Vector3()
            .subVectors(enemy.position, game.player.position)
            .normalize();
        toEnemy.y = 0;

        const dot = playerForward.dot(toEnemy);
        const angleToEnemy = Math.acos(Math.max(-1, Math.min(1, dot)));

        if (angleToEnemy < kickAngle / 2) {
            // Less damage than punch (half)
            const damage = Math.floor(game.stats.attack * 0.5);
            enemy.health -= damage;

            // Simple hit effect (no chain lightning)
            if (enemy.bodyMaterial) {
                const originalEmissive = enemy.bodyMaterial.emissive.getHex();
                enemy.bodyMaterial.emissive.setHex(0xffaa00);
                enemy.bodyMaterial.emissiveIntensity = 1.5;
                setTimeout(() => {
                    if (enemy.bodyMaterial) {
                        enemy.bodyMaterial.emissive.setHex(originalEmissive);
                        enemy.bodyMaterial.emissiveIntensity = 0.5;
                    }
                }, 150);
            }

            // MASSIVE knockback - 5x normal!
            enemy.position.x += toEnemy.x * 10;
            enemy.position.z += toEnemy.z * 10;
        }
    }
}

// Respawn player
function respawnPlayer() {
    game.stats.health = game.stats.maxHealth;
    game.stats.energy = game.stats.maxEnergy;
    game.player.position.set(0, 1, 0);
}

// Mouse handlers
function onMouseMove(event) {
    game.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    game.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

function onMouseDown(event) {
    // Left click (button 0) = left arm, Right click (button 2) = right arm, Middle click (button 1) = kick
    if (event.button === 0) {
        playerAttack(false); // Left arm
    } else if (event.button === 2) {
        playerAttack(true);  // Right arm
    } else if (event.button === 1) {
        playerKick(); // Powerful knockback kick
    }
}

// Window resize
function onResize() {
    game.camera.aspect = window.innerWidth / window.innerHeight;
    game.camera.updateProjectionMatrix();
    game.renderer.setSize(window.innerWidth, window.innerHeight);
}

// Update HUD
function updateHUD() {
    const healthPercent = (game.stats.health / game.stats.maxHealth) * 100;
    const energyPercent = (game.stats.energy / game.stats.maxEnergy) * 100;
    
    document.getElementById('healthBar').style.width = healthPercent + '%';
    document.getElementById('energyBar').style.width = energyPercent + '%';
    document.getElementById('healthText').textContent = ` ${Math.floor(game.stats.health)}/${game.stats.maxHealth}`;
    document.getElementById('energyText').textContent = ` ${Math.floor(game.stats.energy)}/${game.stats.maxEnergy}`;
    document.getElementById('enemyCount').textContent = game.enemies.length;
}

// Animation loop
let lastTime = 0;
let frameCount = 0;
let fpsTime = 0;

function animate(currentTime = 0) {
    requestAnimationFrame(animate);
    
    const delta = (currentTime - lastTime) / 1000;
    lastTime = currentTime;
    
    frameCount++;
    fpsTime += delta;
    if (fpsTime >= 1) {
        document.getElementById('fps').textContent = frameCount;
        frameCount = 0;
        fpsTime = 0;
    }
    
    updatePlayer(delta);
    updateEnemies(delta);
    updateElectricity();
    updateHUD();

    game.renderer.render(game.scene, game.camera);
}

// Animate electricity arcs on fists
function updateElectricity() {
    const time = Date.now() * 0.01;

    // Update right fist electricity
    if (game.player.rightElectricity) {
        game.player.rightElectricity.forEach((arc, i) => {
            const positions = arc.geometry.attributes.position.array;
            const baseAngle = (i / 6) * Math.PI * 2 + time * 0.5;

            // Randomize middle points for flickering effect
            positions[3] = Math.cos(baseAngle) * 0.15 + (Math.random() - 0.5) * 0.08;
            positions[4] = Math.sin(baseAngle) * 0.15 + (Math.random() - 0.5) * 0.08;
            positions[5] = (Math.random() - 0.5) * 0.15;

            positions[6] = Math.cos(baseAngle) * 0.28 + (Math.random() - 0.5) * 0.12;
            positions[7] = Math.sin(baseAngle) * 0.28 + (Math.random() - 0.5) * 0.12;
            positions[8] = (Math.random() - 0.5) * 0.2;

            positions[9] = Math.cos(baseAngle) * 0.4 + (Math.random() - 0.5) * 0.1;
            positions[10] = Math.sin(baseAngle) * 0.4 + (Math.random() - 0.5) * 0.1;
            positions[11] = (Math.random() - 0.5) * 0.15;

            arc.geometry.attributes.position.needsUpdate = true;
            arc.material.opacity = 0.5 + Math.random() * 0.5;
        });
    }

    // Update left fist electricity
    if (game.player.leftElectricity) {
        game.player.leftElectricity.forEach((arc, i) => {
            const positions = arc.geometry.attributes.position.array;
            const baseAngle = (i / 6) * Math.PI * 2 + time * 0.5 + Math.PI;

            positions[3] = Math.cos(baseAngle) * 0.15 + (Math.random() - 0.5) * 0.08;
            positions[4] = Math.sin(baseAngle) * 0.15 + (Math.random() - 0.5) * 0.08;
            positions[5] = (Math.random() - 0.5) * 0.15;

            positions[6] = Math.cos(baseAngle) * 0.28 + (Math.random() - 0.5) * 0.12;
            positions[7] = Math.sin(baseAngle) * 0.28 + (Math.random() - 0.5) * 0.12;
            positions[8] = (Math.random() - 0.5) * 0.2;

            positions[9] = Math.cos(baseAngle) * 0.4 + (Math.random() - 0.5) * 0.1;
            positions[10] = Math.sin(baseAngle) * 0.4 + (Math.random() - 0.5) * 0.1;
            positions[11] = (Math.random() - 0.5) * 0.15;

            arc.geometry.attributes.position.needsUpdate = true;
            arc.material.opacity = 0.5 + Math.random() * 0.5;
        });
    }
}

// Start game
init();
    </script>
