<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE QUEST - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-size: 14px;
            text-shadow: 0 0 10px #0f0;
            pointer-events: none;
            z-index: 100;
        }
        
        .stat-bar {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }
        
        .bar-container {
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0f0;
            margin-left: 10px;
            position: relative;
        }
        
        .bar-fill {
            height: 100%;
            background: #0f0;
            transition: width 0.3s;
        }
        
        .health-bar { background: #f00; }
        .energy-bar { background: #00f; }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0f0;
            font-size: 12px;
            text-shadow: 0 0 5px #0f0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="stat-bar">
            <span>HEALTH:</span>
            <div class="bar-container">
                <div class="bar-fill health-bar" id="healthBar"></div>
            </div>
            <span id="healthText"></span>
        </div>
        <div class="stat-bar">
            <span>ENERGY:</span>
            <div class="bar-container">
                <div class="bar-fill energy-bar" id="energyBar"></div>
            </div>
            <span id="energyText"></span>
        </div>
        <div style="margin-top: 10px;">
            <div>ENEMIES: <span id="enemyCount">0</span></div>
            <div>FPS: <span id="fps">60</span></div>
        </div>
    </div>
    
    <div id="controls">
        W/S - Forward/Back | A/D - Rotate | Click - Attack | Space - Dash | Shift - Block
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
// Game state
const game = {
    scene: null,
    camera: null,
    renderer: null,
    player: null,
    enemies: [],
    keys: {},
    mouse: { x: 0, y: 0 },
    stats: {
        health: 100,
        maxHealth: 100,
        energy: 100,
        maxEnergy: 100,
        attack: 10,
        defense: 5,
        speed: 5
    },
    abilities: {
        dash: { cooldown: 0, maxCooldown: 3 },
        block: { cooldown: 0, maxCooldown: 2, active: false }
    },
    textures: {} // Loaded textures stored here
};

// Texture paths - add textures to the textures/ folder
const TEXTURE_PATHS = {
    // Player textures
    player_torso: 'textures/player_torso.png',
    player_head: 'textures/player_head.png',
    player_upper_arm: 'textures/player_upper_arm.png',
    player_lower_arm: 'textures/player_lower_arm.png',
    player_thigh: 'textures/player_thigh.png',
    player_shin: 'textures/player_shin.png',
    player_foot: 'textures/player_foot.png',
    player_weapon: 'textures/player_weapon.png',
    // Enemy textures
    enemy_torso: 'textures/enemy_torso.png',
    enemy_head: 'textures/enemy_head.png',
    enemy_upper_arm: 'textures/enemy_upper_arm.png',
    enemy_lower_arm: 'textures/enemy_lower_arm.png',
    enemy_thigh: 'textures/enemy_thigh.png',
    enemy_shin: 'textures/enemy_shin.png',
    enemy_foot: 'textures/enemy_foot.png',
    enemy_claw: 'textures/enemy_claw.png',
    // Environment
    ground: 'textures/ground.png'
};

// Load all textures (non-blocking, falls back to solid colors)
function loadTextures() {
    const loader = new THREE.TextureLoader();

    for (const [name, path] of Object.entries(TEXTURE_PATHS)) {
        loader.load(
            path,
            // Success callback
            (texture) => {
                console.log(`Loaded texture: ${name}`);
                game.textures[name] = texture;
                // Update materials that use this texture
                updateMaterialsWithTexture(name, texture);
            },
            // Progress callback (not used)
            undefined,
            // Error callback - texture not found, use solid color (this is fine)
            (err) => {
                console.log(`Texture ${name} not found - using solid color`);
            }
        );
    }
}

// Update existing materials when a texture loads
function updateMaterialsWithTexture(textureName, texture) {
    // Ground texture
    if (textureName === 'ground' && game.ground) {
        game.ground.material.map = texture;
        game.ground.material.needsUpdate = true;
    }

    // Player textures
    if (game.player) {
        const playerMap = {
            'player_torso': game.player.torso,
            'player_head': game.player.head,
            'player_upper_arm': [game.player.rightUpperArm, game.player.leftUpperArm],
            'player_lower_arm': [game.player.rightLowerArm, game.player.leftLowerArm],
            'player_thigh': [game.player.rightUpperLeg, game.player.leftUpperLeg],
            'player_shin': [game.player.rightLowerLeg, game.player.leftLowerLeg],
            'player_foot': [game.player.rightFoot, game.player.leftFoot],
            'player_weapon': game.player.weapon
        };

        if (playerMap[textureName]) {
            const targets = Array.isArray(playerMap[textureName]) ? playerMap[textureName] : [playerMap[textureName]];
            targets.forEach(mesh => {
                if (mesh && mesh.material) {
                    mesh.material.map = texture;
                    mesh.material.needsUpdate = true;
                }
            });
        }
    }

    // Enemy textures - apply to all enemies
    const enemyMap = {
        'enemy_torso': 'torso',
        'enemy_head': 'head',
        'enemy_upper_arm': ['rightUpperArm', 'leftUpperArm'],
        'enemy_lower_arm': ['rightLowerArm', 'leftLowerArm'],
        'enemy_thigh': ['rightUpperLeg', 'leftUpperLeg'],
        'enemy_shin': ['rightLowerLeg', 'leftLowerLeg'],
        'enemy_foot': ['rightFoot', 'leftFoot']
    };

    if (enemyMap[textureName]) {
        game.enemies.forEach(enemy => {
            const parts = Array.isArray(enemyMap[textureName]) ? enemyMap[textureName] : [enemyMap[textureName]];
            parts.forEach(partName => {
                const mesh = enemy[partName];
                if (mesh && mesh.material) {
                    mesh.material.map = texture;
                    mesh.material.needsUpdate = true;
                }
            });
        });
    }

    // Enemy claw is a Group with multiple meshes
    if (textureName === 'enemy_claw') {
        game.enemies.forEach(enemy => {
            if (enemy.weapon) {
                enemy.weapon.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.map = texture;
                        child.material.needsUpdate = true;
                    }
                });
            }
        });
    }
}

// Apply all loaded textures to an enemy (called after spawn)
function applyEnemyTextures(enemy) {
    const enemyTextureMap = {
        'enemy_torso': 'torso',
        'enemy_head': 'head',
        'enemy_upper_arm': ['rightUpperArm', 'leftUpperArm'],
        'enemy_lower_arm': ['rightLowerArm', 'leftLowerArm'],
        'enemy_thigh': ['rightUpperLeg', 'leftUpperLeg'],
        'enemy_shin': ['rightLowerLeg', 'leftLowerLeg'],
        'enemy_foot': ['rightFoot', 'leftFoot']
    };

    for (const [textureName, partNames] of Object.entries(enemyTextureMap)) {
        if (game.textures[textureName]) {
            const parts = Array.isArray(partNames) ? partNames : [partNames];
            parts.forEach(partName => {
                const mesh = enemy[partName];
                if (mesh && mesh.material) {
                    mesh.material.map = game.textures[textureName];
                    mesh.material.needsUpdate = true;
                }
            });
        }
    }

    // Apply claw texture to all claw parts (weapon is a Group with multiple meshes)
    if (game.textures['enemy_claw'] && enemy.weapon) {
        enemy.weapon.traverse(child => {
            if (child.isMesh && child.material) {
                child.material.map = game.textures['enemy_claw'];
                child.material.needsUpdate = true;
            }
        });
    }
}

// Helper: Create material with optional texture
function createMaterial(color, emissiveColor, textureName, options = {}) {
    const material = new THREE.MeshStandardMaterial({
        color: color,
        emissive: emissiveColor || color,
        emissiveIntensity: options.emissiveIntensity || 0.5,
        metalness: options.metalness || 0.3,
        roughness: options.roughness || 0.7
    });

    // Apply texture if already loaded
    if (game.textures[textureName]) {
        material.map = game.textures[textureName];
    }

    return material;
}

// Check if Three.js loaded
if (typeof THREE === 'undefined') {
    document.body.innerHTML = '<div style="color: white; padding: 20px;">ERROR: Three.js failed to load. Check your internet connection.</div>';
    throw new Error('Three.js not loaded');
}

// Initialize Three.js
function init() {
    console.log('Initializing game...');

    // Start loading textures (non-blocking)
    loadTextures();

    // Scene
    game.scene = new THREE.Scene();
    game.scene.background = new THREE.Color(0xffffff);
    
    // Camera
    game.camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    game.camera.position.set(0, 8, 12);
    game.camera.lookAt(0, 0, 0);
    
    // Renderer
    const canvas = document.getElementById('gameCanvas');
    game.renderer = new THREE.WebGLRenderer({ 
        canvas: canvas,
        antialias: true 
    });
    game.renderer.setSize(window.innerWidth, window.innerHeight);
    game.renderer.setPixelRatio(window.devicePixelRatio);
    
    // Brighter lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    game.scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 20, 10);
    game.scene.add(dirLight);
    
    // Additional point light at origin
    const pointLight = new THREE.PointLight(0xffffff, 1, 100);
    pointLight.position.set(0, 10, 0);
    game.scene.add(pointLight);
    
    // Ground with yellow color
    const groundGeometry = new THREE.PlaneGeometry(100, 100);
    const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0xffdd00,
        roughness: 0.8,
        metalness: 0.2
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    game.ground = ground; // Store reference for texture updates
    game.scene.add(ground);

    console.log('Ground added');
    
    // Visible grid (dark orange on yellow ground)
    const gridHelper = new THREE.GridHelper(100, 50, 0xcc8800, 0xcc8800);
    gridHelper.position.y = 0.01;
    game.scene.add(gridHelper);
    
    console.log('Grid added');
    
    // Create player
    createPlayer();
    console.log('Player created at:', game.player.position);
    
    // Create initial enemies
    for (let i = 0; i < 5; i++) {
        spawnEnemy();
    }
    console.log('Enemies spawned:', game.enemies.length);
    
    // Event listeners
    window.addEventListener('resize', onResize);
    document.addEventListener('keydown', (e) => game.keys[e.key.toLowerCase()] = true);
    document.addEventListener('keyup', (e) => game.keys[e.key.toLowerCase()] = false);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('click', onMouseClick);
    
    console.log('Starting animation loop...');
    
    // Start game loop
    animate();
}

// Create player with hierarchical body parts
function createPlayer() {
    // Main container
    game.player = new THREE.Group();
    game.player.position.set(0, 0, 0);

    // Materials
    const torsoMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ff00,
        emissive: 0x00ff00,
        emissiveIntensity: 0.5,
        metalness: 0.3,
        roughness: 0.7
    });
    const armMaterial = new THREE.MeshStandardMaterial({
        color: 0x00cc00,
        emissive: 0x00cc00,
        emissiveIntensity: 0.3
    });
    const legMaterial = new THREE.MeshStandardMaterial({
        color: 0x009900,
        emissive: 0x009900,
        emissiveIntensity: 0.3
    });
    const footMaterial = new THREE.MeshStandardMaterial({
        color: 0x006600,
        emissive: 0x006600,
        emissiveIntensity: 0.3
    });

    // TORSO (root of body hierarchy)
    const torsoGeometry = new THREE.BoxGeometry(0.8, 1.0, 0.5);
    const torso = new THREE.Mesh(torsoGeometry, torsoMaterial);
    torso.position.y = 1.5;
    game.player.torso = torso;
    game.player.add(torso);

    // HEAD (child of torso)
    const headGeometry = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    const headMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ff00,
        emissive: 0x00ff00,
        emissiveIntensity: 0.7
    });
    const head = new THREE.Mesh(headGeometry, headMaterial);
    head.position.y = 0.8; // Relative to torso
    game.player.head = head;
    torso.add(head);

    // VISOR (child of head)
    const visorGeometry = new THREE.BoxGeometry(0.5, 0.15, 0.35);
    const visorMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 1.0
    });
    const visor = new THREE.Mesh(visorGeometry, visorMaterial);
    visor.position.set(0, 0, -0.3); // Relative to head - FRONT of face (toward -Z movement direction)
    game.player.visor = visor;
    head.add(visor);

    // RIGHT ARM HIERARCHY
    const rightArmPivot = new THREE.Group();
    rightArmPivot.position.set(0.5, 0.4, 0); // Shoulder position relative to torso
    torso.add(rightArmPivot);
    game.player.rightArmPivot = rightArmPivot;

    const upperArmGeometry = new THREE.BoxGeometry(0.2, 0.6, 0.2);
    const rightUpperArm = new THREE.Mesh(upperArmGeometry, armMaterial.clone());
    rightUpperArm.position.y = -0.3; // Center below pivot
    game.player.rightUpperArm = rightUpperArm;
    rightArmPivot.add(rightUpperArm);

    const rightElbowPivot = new THREE.Group();
    rightElbowPivot.position.y = -0.6; // Elbow at bottom of upper arm
    rightUpperArm.add(rightElbowPivot);
    game.player.rightElbowPivot = rightElbowPivot;

    const lowerArmGeometry = new THREE.BoxGeometry(0.18, 0.5, 0.18);
    const rightLowerArm = new THREE.Mesh(lowerArmGeometry, armMaterial.clone());
    rightLowerArm.position.y = -0.25; // Center below elbow
    game.player.rightLowerArm = rightLowerArm;
    rightElbowPivot.add(rightLowerArm);

    // WRIST PIVOT (allows weapon to stay forward during arm rotation)
    const rightWristPivot = new THREE.Group();
    rightWristPivot.position.y = -0.25; // At end of lower arm (wrist position)
    rightLowerArm.add(rightWristPivot);
    game.player.rightWristPivot = rightWristPivot;

    // WEAPON (child of wrist pivot - can be counter-rotated)
    const weaponHandle = new THREE.BoxGeometry(0.15, 0.15, 0.6);
    const weaponHandleMaterial = new THREE.MeshStandardMaterial({
        color: 0x888888,
        metalness: 0.5
    });
    const handle = new THREE.Mesh(weaponHandle, weaponHandleMaterial);
    handle.position.set(0, 0, -0.3); // Relative to wrist
    rightWristPivot.add(handle);

    const weaponBlade = new THREE.BoxGeometry(0.3, 0.1, 1.2);
    const weaponBladeMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00ffff,
        emissiveIntensity: 0.7,
        metalness: 0.8
    });
    game.player.weapon = new THREE.Mesh(weaponBlade, weaponBladeMaterial);
    game.player.weapon.position.set(0, 0, -0.9); // Extended from handle
    rightWristPivot.add(game.player.weapon);

    // LEFT ARM HIERARCHY
    const leftArmPivot = new THREE.Group();
    leftArmPivot.position.set(-0.5, 0.4, 0);
    torso.add(leftArmPivot);
    game.player.leftArmPivot = leftArmPivot;

    const leftUpperArm = new THREE.Mesh(upperArmGeometry, armMaterial.clone());
    leftUpperArm.position.y = -0.3;
    game.player.leftUpperArm = leftUpperArm;
    leftArmPivot.add(leftUpperArm);

    const leftElbowPivot = new THREE.Group();
    leftElbowPivot.position.y = -0.6;
    leftUpperArm.add(leftElbowPivot);
    game.player.leftElbowPivot = leftElbowPivot;

    const leftLowerArm = new THREE.Mesh(lowerArmGeometry, armMaterial.clone());
    leftLowerArm.position.y = -0.25;
    game.player.leftLowerArm = leftLowerArm;
    leftElbowPivot.add(leftLowerArm);

    // RIGHT LEG HIERARCHY
    const rightLegPivot = new THREE.Group();
    rightLegPivot.position.set(0.25, -0.5, 0); // Hip position relative to torso
    torso.add(rightLegPivot);
    game.player.rightLegPivot = rightLegPivot;

    const upperLegGeometry = new THREE.BoxGeometry(0.3, 0.6, 0.3);
    const rightUpperLeg = new THREE.Mesh(upperLegGeometry, legMaterial.clone());
    rightUpperLeg.position.y = -0.3;
    game.player.rightUpperLeg = rightUpperLeg;
    rightLegPivot.add(rightUpperLeg);

    const rightKneePivot = new THREE.Group();
    rightKneePivot.position.y = -0.6;
    rightUpperLeg.add(rightKneePivot);
    game.player.rightKneePivot = rightKneePivot;

    const lowerLegGeometry = new THREE.BoxGeometry(0.25, 0.5, 0.25);
    const rightLowerLeg = new THREE.Mesh(lowerLegGeometry, legMaterial.clone());
    rightLowerLeg.position.y = -0.25;
    game.player.rightLowerLeg = rightLowerLeg;
    rightKneePivot.add(rightLowerLeg);

    const rightAnklePivot = new THREE.Group();
    rightAnklePivot.position.y = -0.5;
    rightLowerLeg.add(rightAnklePivot);
    game.player.rightAnklePivot = rightAnklePivot;

    const footGeometry = new THREE.BoxGeometry(0.28, 0.15, 0.4);
    const rightFoot = new THREE.Mesh(footGeometry, footMaterial.clone());
    rightFoot.position.set(0, -0.08, 0.1);
    game.player.rightFoot = rightFoot;
    rightAnklePivot.add(rightFoot);

    // LEFT LEG HIERARCHY
    const leftLegPivot = new THREE.Group();
    leftLegPivot.position.set(-0.25, -0.5, 0);
    torso.add(leftLegPivot);
    game.player.leftLegPivot = leftLegPivot;

    const leftUpperLeg = new THREE.Mesh(upperLegGeometry, legMaterial.clone());
    leftUpperLeg.position.y = -0.3;
    game.player.leftUpperLeg = leftUpperLeg;
    leftLegPivot.add(leftUpperLeg);

    const leftKneePivot = new THREE.Group();
    leftKneePivot.position.y = -0.6;
    leftUpperLeg.add(leftKneePivot);
    game.player.leftKneePivot = leftKneePivot;

    const leftLowerLeg = new THREE.Mesh(lowerLegGeometry, legMaterial.clone());
    leftLowerLeg.position.y = -0.25;
    game.player.leftLowerLeg = leftLowerLeg;
    leftKneePivot.add(leftLowerLeg);

    const leftAnklePivot = new THREE.Group();
    leftAnklePivot.position.y = -0.5;
    leftLowerLeg.add(leftAnklePivot);
    game.player.leftAnklePivot = leftAnklePivot;

    const leftFoot = new THREE.Mesh(footGeometry, footMaterial.clone());
    leftFoot.position.set(0, -0.08, 0.1);
    game.player.leftFoot = leftFoot;
    leftAnklePivot.add(leftFoot);

    // Animation state
    game.player.animTime = 0;
    game.player.walkCycle = 0;

    // Player properties
    game.player.velocity = new THREE.Vector3();
    game.player.rotation.y = 0;
    game.player.health = game.stats.health;
    game.player.isAttacking = false;
    game.player.attackCooldown = 0;
    game.player.isDashing = false;
    game.player.dashTime = 0;

    // Speed lines for dashing (initially hidden)
    game.player.speedLines = [];
    for (let i = 0; i < 5; i++) {
        const lineGeometry = new THREE.BoxGeometry(0.1, 0.1, 2);
        const lineMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.6
        });
        const line = new THREE.Mesh(lineGeometry, lineMaterial);
        line.visible = false;
        game.player.speedLines.push(line);
        game.player.add(line);
    }

    game.scene.add(game.player);
    console.log('Animated player added to scene');
}

// Spawn enemy with hierarchical body parts
function spawnEnemy() {
    // Main container
    const enemy = new THREE.Group();

    // Materials
    const torsoMaterial = new THREE.MeshStandardMaterial({
        color: 0xff0000,
        emissive: 0xff0000,
        emissiveIntensity: 0.5,
        metalness: 0.3,
        roughness: 0.7
    });
    const armMaterial = new THREE.MeshStandardMaterial({
        color: 0xaa0000,
        emissive: 0xaa0000,
        emissiveIntensity: 0.3
    });
    const legMaterial = new THREE.MeshStandardMaterial({
        color: 0x880000,
        emissive: 0x880000,
        emissiveIntensity: 0.3
    });
    const footMaterial = new THREE.MeshStandardMaterial({
        color: 0x660000,
        emissive: 0x660000,
        emissiveIntensity: 0.3
    });

    // TORSO (root of body hierarchy)
    const torsoGeometry = new THREE.BoxGeometry(0.7, 0.9, 0.4);
    const torso = new THREE.Mesh(torsoGeometry, torsoMaterial);
    torso.position.y = 1.3;
    enemy.torso = torso;
    enemy.add(torso);

    // HEAD (child of torso)
    const headGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const headMaterial = new THREE.MeshStandardMaterial({
        color: 0xcc0000,
        emissive: 0xff0000,
        emissiveIntensity: 0.6
    });
    const head = new THREE.Mesh(headGeometry, headMaterial);
    head.position.y = 0.7; // Relative to torso
    enemy.head = head;
    torso.add(head);

    // EYE VISOR (child of head)
    const eyeGeometry = new THREE.BoxGeometry(0.4, 0.12, 0.3);
    const eyeMaterial = new THREE.MeshStandardMaterial({
        color: 0xffff00,
        emissive: 0xffff00,
        emissiveIntensity: 1.0
    });
    const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    eye.position.set(0, 0, -0.25); // Relative to head - FRONT of face (toward -Z movement direction)
    enemy.eye = eye;
    head.add(eye);

    // RIGHT ARM HIERARCHY
    // Right Upper Arm pivot (attached to torso shoulder)
    const rightArmPivot = new THREE.Group();
    rightArmPivot.position.set(0.45, 0.35, 0); // Shoulder position relative to torso
    torso.add(rightArmPivot);
    enemy.rightArmPivot = rightArmPivot;

    const upperArmGeometry = new THREE.BoxGeometry(0.18, 0.5, 0.18);
    const rightUpperArm = new THREE.Mesh(upperArmGeometry, armMaterial.clone());
    rightUpperArm.position.y = -0.25; // Center of upper arm below pivot
    enemy.rightUpperArm = rightUpperArm;
    rightArmPivot.add(rightUpperArm);

    // Right Lower Arm pivot (attached to upper arm elbow)
    const rightElbowPivot = new THREE.Group();
    rightElbowPivot.position.y = -0.5; // Elbow position at bottom of upper arm
    rightUpperArm.add(rightElbowPivot);
    enemy.rightElbowPivot = rightElbowPivot;

    const lowerArmGeometry = new THREE.BoxGeometry(0.15, 0.4, 0.15);
    const rightLowerArm = new THREE.Mesh(lowerArmGeometry, armMaterial.clone());
    rightLowerArm.position.y = -0.2; // Center of lower arm below pivot
    enemy.rightLowerArm = rightLowerArm;
    rightElbowPivot.add(rightLowerArm);

    // Weapon (3-fingered claw on right hand)
    const clawMaterial = new THREE.MeshStandardMaterial({
        color: 0xff6600,
        emissive: 0xff6600,
        emissiveIntensity: 0.6,
        metalness: 0.7
    });

    // Claw container group
    const claw = new THREE.Group();
    claw.position.set(0, -0.35, 0); // At the fist

// Update player
function updatePlayer(delta) {
    if (!game.player || delta > 0.1) return;
    
    if (game.player.attackCooldown > 0) {
        game.player.attackCooldown -= delta;
    }
    
    if (game.player.dashTime > 0) {
        game.player.dashTime -= delta;
        if (game.player.dashTime <= 0) {
            game.player.isDashing = false;
        }
    }
    
    for (let ability in game.abilities) {
        if (game.abilities[ability].cooldown > 0) {
            game.abilities[ability].cooldown -= delta;
        }
    }
    
    // Energy regeneration system
    if (game.stats.energy <= 0) {
        // Out of energy - rapid recharge but can't move
        game.stats.energy = Math.min(game.stats.maxEnergy, game.stats.energy + 50 * delta);
    } else if (game.stats.energy < game.stats.maxEnergy) {
        // Normal slow regeneration
        game.stats.energy = Math.min(game.stats.maxEnergy, game.stats.energy + 3 * delta);
    }
    
    // Can't do anything with no energy
    if (game.stats.energy <= 0) {
        return;
    }
    
    const moveSpeed = game.player.isDashing ? game.stats.speed * 3 : game.stats.speed;
    const rotateSpeed = 3;
    let isMoving = false;
    let isMovingForward = false;
    let isMovingBackward = false;
    let isRotating = false;
    
    // A/D rotates player (no energy cost)
    if (game.keys['a'] || game.keys['arrowleft']) {
        game.player.rotation.y += rotateSpeed * delta;
        isRotating = true;
    }
    if (game.keys['d'] || game.keys['arrowright']) {
        game.player.rotation.y -= rotateSpeed * delta;
        isRotating = true;
    }
    
    // W/S moves forward/backward (costs energy)
    if (game.keys['w'] || game.keys['arrowup']) {
        game.player.position.x -= Math.sin(game.player.rotation.y) * moveSpeed * delta;
        game.player.position.z -= Math.cos(game.player.rotation.y) * moveSpeed * delta;
        isMoving = true;
        isMovingForward = true;
    }
    if (game.keys['s'] || game.keys['arrowdown']) {
        game.player.position.x += Math.sin(game.player.rotation.y) * moveSpeed * delta;
        game.player.position.z += Math.cos(game.player.rotation.y) * moveSpeed * delta;
        isMoving = true;
        isMovingBackward = true;
    }
    
    // Walking drains energy (1 per 5 seconds = 0.2 per second)
    if (isMoving && !game.player.isDashing) {
        game.stats.energy -= 0.2 * delta;
        if (game.stats.energy < 0) game.stats.energy = 0;
    }
    
    // Dash ability (can use anytime if sufficient energy)
    if (game.keys[' '] && !game.player.isDashing && game.stats.energy >= 20) {
        game.player.isDashing = true;
        game.player.dashTime = 0.3;
        game.abilities.dash.cooldown = game.abilities.dash.maxCooldown;
        game.stats.energy -= 20;
    }
    
    // Block ability (instant toggle - hold Shift to block, release to unblock)
    if (game.keys['shift']) {
        if (!game.abilities.block.active) {
            game.abilities.block.active = true;
            // Change torso color to blue when blocking
            if (game.player.torso) {
                game.player.torso.material.emissive.setHex(0x0000ff);
            }
        }
    } else {
        if (game.abilities.block.active) {
            game.abilities.block.active = false;
            // No cooldown - can block again immediately
            // Change torso back to green
            if (game.player.torso) {
                game.player.torso.material.emissive.setHex(0x00ff00);
            }
        }
    }
    
    game.player.position.x = Math.max(-45, Math.min(45, game.player.position.x));
    game.player.position.z = Math.max(-45, Math.min(45, game.player.position.z));
    
    // Camera always behind player
    const cameraDistance = 10;
    const cameraHeight = 8;
    
    const targetCamX = game.player.position.x + Math.sin(game.player.rotation.y) * cameraDistance;
    const targetCamZ = game.player.position.z + Math.cos(game.player.rotation.y) * cameraDistance;
    const targetCamY = game.player.position.y + cameraHeight;
    
    game.camera.position.x += (targetCamX - game.camera.position.x) * 0.1;
    game.camera.position.z += (targetCamZ - game.camera.position.z) * 0.1;
    game.camera.position.y += (targetCamY - game.camera.position.y) * 0.1;
    game.camera.lookAt(game.player.position);
    
    // Animate body parts
    animatePlayer(delta, isMovingForward, isMovingBackward, isRotating);
}

// Animate player body parts (using hierarchical pivots)
function animatePlayer(delta, isMovingForward, isMovingBackward, isRotating) {
    if (!game.player) return;

    game.player.animTime += delta;

    const isBlocking = game.abilities.block.active;
    const isDashing = game.player.isDashing;
    const isAttacking = game.player.isAttacking;

    const walkSpeed = 4;
    const walkAmplitude = 0.4;

    // DASHING ANIMATION
    if (isDashing) {
        // Arms stretched back (rotate shoulder pivots)
        game.player.rightArmPivot.rotation.x = 1.2;
        game.player.leftArmPivot.rotation.x = 1.2;
        game.player.rightElbowPivot.rotation.x = 0.3;
        game.player.leftElbowPivot.rotation.x = 0.3;

        // Torso leans forward
        game.player.torso.rotation.x = 0.3;

        // Fast leg movement
        const dashCycle = Math.sin(game.player.animTime * 15);
        game.player.rightLegPivot.rotation.x = dashCycle * 0.8;
        game.player.leftLegPivot.rotation.x = -dashCycle * 0.8;
        game.player.rightKneePivot.rotation.x = Math.max(0, -dashCycle) * 0.6;
        game.player.leftKneePivot.rotation.x = Math.max(0, dashCycle) * 0.6;

        // Speed lines
        for (let i = 0; i < game.player.speedLines.length; i++) {
            const line = game.player.speedLines[i];
            line.visible = true;
            line.position.set(
                (Math.random() - 0.5) * 0.5,
                1 + (Math.random() - 0.5) * 0.8,
                0.5 + i * 0.3
            );
        }

        // If attacking while dashing, use piston lunge
        if (isAttacking) {
            game.player.rightArmPivot.rotation.x = Math.PI / 2;
            game.player.rightElbowPivot.rotation.x = 0;
            // Counter-rotate wrist so sword stays pointing forward
            game.player.rightWristPivot.rotation.x = -Math.PI / 2;
        }
    }
    // ATTACKING ANIMATION - Pulley/Piston lunge style (CHECK BEFORE BLOCKING)
    else if (isAttacking) {
        // Arm extends straight out like a piston/pulley mechanism
        game.player.rightArmPivot.rotation.x = Math.PI / 2;  // 90 degrees - arm points straight forward
        game.player.rightArmPivot.rotation.z = 0;

        // Elbow STRAIGHTENS for maximum reach - like a telescoping piston
        game.player.rightElbowPivot.rotation.x = 0;  // Fully straight

        // WRIST counter-rotates to keep sword pointing FORWARD (not down)
        // Shoulder +90° would make sword point down, so wrist -90° corrects it
        game.player.rightWristPivot.rotation.x = -Math.PI / 2;

        // Torso leans into the lunge
        game.player.torso.rotation.x = 0.3;

        // Left arm pulls back for counterbalance
        game.player.leftArmPivot.rotation.x = -0.5;
        game.player.leftElbowPivot.rotation.x = -0.8;

        // Legs brace - front leg forward, back leg straight
        game.player.rightLegPivot.rotation.x = 0.3;
        game.player.leftLegPivot.rotation.x = -0.2;
        game.player.rightKneePivot.rotation.x = 0.2;
        game.player.leftKneePivot.rotation.x = 0;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // BLOCKING ANIMATION
    else if (isBlocking) {
        // Arms in X formation in FRONT of body (positive X = forward)
        game.player.rightArmPivot.rotation.x = 0.8;   // Forward
        game.player.rightArmPivot.rotation.z = -0.3;  // Slight outward tilt
        game.player.leftArmPivot.rotation.x = 0.8;    // Forward
        game.player.leftArmPivot.rotation.z = 0.3;    // Slight outward tilt
        game.player.rightElbowPivot.rotation.x = 0.8; // Bend toward body
        game.player.leftElbowPivot.rotation.x = 0.8;
        game.player.rightWristPivot.rotation.x = 0;   // Wrist normal

        // Legs still animate if walking
        if (isMovingForward || isMovingBackward) {
            const walkCycle = Math.sin(game.player.animTime * walkSpeed);
            game.player.rightLegPivot.rotation.x = walkCycle * walkAmplitude;
            game.player.leftLegPivot.rotation.x = -walkCycle * walkAmplitude;
            game.player.rightKneePivot.rotation.x = Math.max(0, -walkCycle) * 0.5;
            game.player.leftKneePivot.rotation.x = Math.max(0, walkCycle) * 0.5;
        } else {
            game.player.rightLegPivot.rotation.x = 0;
            game.player.leftLegPivot.rotation.x = 0;
            game.player.rightKneePivot.rotation.x = 0;
            game.player.leftKneePivot.rotation.x = 0;
        }

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // MOONWALK (walking backward easter egg!)
    else if (isMovingBackward) {
        const moonwalkCycle = Math.sin(game.player.animTime * 5);

        // Legs do Michael Jackson moonwalk
        game.player.rightLegPivot.rotation.x = moonwalkCycle * 0.4;
        game.player.leftLegPivot.rotation.x = -moonwalkCycle * 0.4;
        game.player.rightKneePivot.rotation.x = Math.abs(moonwalkCycle) * 0.4;
        game.player.leftKneePivot.rotation.x = Math.abs(moonwalkCycle) * 0.4;

        // Feet slide
        game.player.rightAnklePivot.rotation.x = -0.2;
        game.player.leftAnklePivot.rotation.x = -0.2;

        // Arms swing smoothly
        game.player.rightArmPivot.rotation.x = moonwalkCycle * 0.3;
        game.player.leftArmPivot.rotation.x = -moonwalkCycle * 0.3;
        game.player.rightArmPivot.rotation.z = 0; // Reset z-rotation from blocking
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = 0;
        game.player.leftElbowPivot.rotation.x = 0;
        game.player.rightWristPivot.rotation.x = 0; // Wrist normal

        // Torso upright and smooth
        game.player.torso.rotation.x = 0;
        game.player.torso.position.y = 1.5 + Math.abs(moonwalkCycle) * 0.05;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // NORMAL WALKING
    else if (isMovingForward) {
        const walkCycle = Math.sin(game.player.animTime * walkSpeed);

        // Arms swing opposite to legs (rotate pivots)
        game.player.rightArmPivot.rotation.x = -walkCycle * 0.5;
        game.player.leftArmPivot.rotation.x = walkCycle * 0.5;
        game.player.rightArmPivot.rotation.z = 0; // Reset z-rotation from blocking
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = -0.2;
        game.player.leftElbowPivot.rotation.x = -0.2;
        game.player.rightWristPivot.rotation.x = 0; // Wrist normal

        // Legs walk (rotate hip pivots)
        game.player.rightLegPivot.rotation.x = walkCycle * walkAmplitude;
        game.player.leftLegPivot.rotation.x = -walkCycle * walkAmplitude;
        game.player.rightKneePivot.rotation.x = Math.max(0, -walkCycle) * 0.5;
        game.player.leftKneePivot.rotation.x = Math.max(0, walkCycle) * 0.5;

        // Torso slight bob and sway
        game.player.torso.position.y = 1.5 + Math.abs(walkCycle) * 0.05;
        game.player.torso.rotation.z = walkCycle * 0.05;
        game.player.torso.rotation.x = 0;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // ROTATING (turning)
    else if (isRotating) {
        const turnCycle = Math.sin(game.player.animTime * 3);

        // Slight lean in turn direction
        game.player.torso.rotation.z = turnCycle * 0.1;

        // Arms sway slightly
        game.player.rightArmPivot.rotation.x = turnCycle * 0.2;
        game.player.leftArmPivot.rotation.x = -turnCycle * 0.2;
        game.player.rightArmPivot.rotation.z = 0; // Reset z-rotation from blocking
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = 0;
        game.player.leftElbowPivot.rotation.x = 0;
        game.player.rightWristPivot.rotation.x = 0; // Wrist normal

        // Reset legs
        game.player.rightLegPivot.rotation.x = 0;
        game.player.leftLegPivot.rotation.x = 0;
        game.player.rightKneePivot.rotation.x = 0;
        game.player.leftKneePivot.rotation.x = 0;

        game.player.speedLines.forEach(line => line.visible = false);
    }
    // IDLE
    else {
        // Gentle idle breathing
        const breathCycle = Math.sin(game.player.animTime * 2);
        game.player.torso.position.y = 1.5 + breathCycle * 0.02;

        // Arms at rest
        game.player.rightArmPivot.rotation.x = 0;
        game.player.leftArmPivot.rotation.x = 0;
        game.player.rightArmPivot.rotation.z = 0;
        game.player.leftArmPivot.rotation.z = 0;
        game.player.rightElbowPivot.rotation.x = 0;
        game.player.leftElbowPivot.rotation.x = 0;

        // Wrist at rest (sword points forward in -Z)
        game.player.rightWristPivot.rotation.x = 0;

        // Legs at rest
        game.player.rightLegPivot.rotation.x = 0;
        game.player.leftLegPivot.rotation.x = 0;
        game.player.rightKneePivot.rotation.x = 0;
        game.player.leftKneePivot.rotation.x = 0;
        game.player.rightAnklePivot.rotation.x = 0;
        game.player.leftAnklePivot.rotation.x = 0;

        // Reset torso
        game.player.torso.rotation.x = 0;
        game.player.torso.rotation.z = 0;

        game.player.speedLines.forEach(line => line.visible = false);
    }
}

// Animate enemy body parts (using hierarchical pivots)
function animateEnemy(enemy, delta) {
    if (!enemy || !enemy.torso) return;

    enemy.animTime += delta;

    const walkSpeed = 6;
    const walkAmplitude = 0.5;

    // ATTACKING ANIMATION (smooth interpolation)
    if (enemy.isAttacking) {
        enemy.attackAnimTime += delta;

        // Animation phases: wind-up (0-0.15s), thrust (0.15-0.35s), hold (0.35-0.5s)
        const t = enemy.attackAnimTime;
        let attackProgress;

        if (t < 0.15) {
            // Wind-up phase: arm pulls back slightly
            attackProgress = -0.3 * (t / 0.15);
        } else if (t < 0.35) {
            // Thrust phase: smooth interpolation from wind-up to full extension
            const thrustT = (t - 0.15) / 0.2;
            attackProgress = -0.3 + (1.8) * thrustT; // From -0.3 to 1.5
        } else {
            // Hold phase: full extension
            attackProgress = 1.5;
        }

        // Right arm thrusts forward smoothly
        enemy.rightArmPivot.rotation.x = attackProgress;
        enemy.rightElbowPivot.rotation.x = Math.max(0, attackProgress * 0.2);

        // Torso leans forward with the thrust
        enemy.torso.rotation.x = Math.max(0, attackProgress * 0.2);

        // Left arm stays back for balance
        enemy.leftArmPivot.rotation.x = -0.3 - Math.max(0, attackProgress * 0.15);

        // Legs brace during thrust
        const braceAmount = Math.max(0, attackProgress / 1.5);
        enemy.rightLegPivot.rotation.x = -0.2 * braceAmount;
        enemy.leftLegPivot.rotation.x = 0.2 * braceAmount;

        // Eye pulses bright during attack
        if (enemy.eye) {
            enemy.eye.material.emissiveIntensity = 1.5 + Math.sin(t * 20) * 0.5;
        }

        // Attack animation duration
        if (t > 0.5) {
            enemy.isAttacking = false;
            enemy.attackAnimTime = 0;
        }
    }
    // WALKING ANIMATION
    else if (enemy.isWalking) {
        const walkCycle = Math.sin(enemy.animTime * walkSpeed);

        // Arms swing opposite to legs (rotate pivots)
        enemy.rightArmPivot.rotation.x = -walkCycle * 0.5;
        enemy.leftArmPivot.rotation.x = walkCycle * 0.5;
        // Slight elbow bend while walking
        enemy.rightElbowPivot.rotation.x = -0.2;
        enemy.leftElbowPivot.rotation.x = -0.2;

        // Legs walk (rotate hip pivots)
        enemy.rightLegPivot.rotation.x = walkCycle * walkAmplitude;
        enemy.leftLegPivot.rotation.x = -walkCycle * walkAmplitude;
        // Knee bends when leg swings back
        enemy.rightKneePivot.rotation.x = Math.max(0, -walkCycle) * 0.6;
        enemy.leftKneePivot.rotation.x = Math.max(0, walkCycle) * 0.6;

        // Torso bob and sway
        enemy.torso.position.y = 1.3 + Math.abs(walkCycle) * 0.04;
        enemy.torso.rotation.z = walkCycle * 0.04;
        enemy.torso.rotation.x = 0.1;

        // Eye normal intensity
        if (enemy.eye) {
            enemy.eye.material.emissiveIntensity = 1.0;
        }
    }
    // IDLE ANIMATION
    else {
        const breathCycle = Math.sin(enemy.animTime * 2);
        const lookCycle = Math.sin(enemy.animTime * 0.5);

        // Gentle breathing
        enemy.torso.position.y = 1.3 + breathCycle * 0.02;
        enemy.torso.rotation.x = 0;
        enemy.torso.rotation.z = 0;

        // Arms at rest with slight sway
        enemy.rightArmPivot.rotation.x = breathCycle * 0.05;
        enemy.leftArmPivot.rotation.x = -breathCycle * 0.05;
        enemy.rightElbowPivot.rotation.x = 0;
        enemy.leftElbowPivot.rotation.x = 0;

        // Legs at rest
        enemy.rightLegPivot.rotation.x = 0;
        enemy.leftLegPivot.rotation.x = 0;
        enemy.rightKneePivot.rotation.x = 0;
        enemy.leftKneePivot.rotation.x = 0;

        // Head looks around slightly
        enemy.head.rotation.y = lookCycle * 0.2;

        // Eye pulses gently
        if (enemy.eye) {
            enemy.eye.material.emissiveIntensity = 0.8 + breathCycle * 0.2;
        }
    }
}

// Update enemies
function updateEnemies(delta) {
    for (let i = game.enemies.length - 1; i >= 0; i--) {
        const enemy = game.enemies[i];

        if (!enemy.isActive) continue;

        if (enemy.attackCooldown > 0) {
            enemy.attackCooldown -= delta;
        }

        const distanceToPlayer = enemy.position.distanceTo(game.player.position);

        // Reset walking state
        enemy.isWalking = false;

        if (distanceToPlayer < enemy.detectionRange) {
            if (distanceToPlayer > enemy.attackRange) {
                // Walking towards player
                enemy.isWalking = true;

                const direction = new THREE.Vector3()
                    .subVectors(game.player.position, enemy.position)
                    .normalize();

                enemy.position.x += direction.x * enemy.speed * delta;
                enemy.position.z += direction.z * enemy.speed * delta;

                // Face the player (only rotate Y axis)
                // Model's face is at -Z, so add PI to face toward player
                const targetAngle = Math.atan2(
                    game.player.position.x - enemy.position.x,
                    game.player.position.z - enemy.position.z
                );
                enemy.rotation.y = targetAngle + Math.PI;
            } else {
                // In attack range
                if (enemy.attackCooldown <= 0 && !enemy.isAttacking) {
                    enemy.isAttacking = true;
                    enemy.attackAnimTime = 0;
                    attackPlayer(enemy);
                    enemy.attackCooldown = 1.5;
                }
            }
        }

        // Animate the enemy
        animateEnemy(enemy, delta);

        // Death
        if (enemy.health <= 0) {
            game.scene.remove(enemy);
            game.enemies.splice(i, 1);
            setTimeout(() => spawnEnemy(), 2000);
        }
    }
}

// Enemy attacks player
function attackPlayer(enemy) {
    const damage = game.abilities.block.active ? 
        Math.max(1, enemy.attackDamage - game.stats.defense) : 
        enemy.attackDamage;
    
    game.stats.health -= damage;
    
    // Flash effect on torso
    if (game.player.torso) {
        const originalEmissive = game.player.torso.material.emissive.getHex();
        game.player.torso.material.emissive.setHex(0xff0000);
        setTimeout(() => {
            game.player.torso.material.emissive.setHex(originalEmissive);
        }, 100);
    }
    
    if (game.stats.health <= 0) {
        respawnPlayer();
    }
}

// Player attack
function playerAttack() {
    if (game.player.attackCooldown > 0 || game.player.isAttacking) return;
    
    // Need at least 2 energy to attack
    if (game.stats.energy < 2) return;
    
    game.player.isAttacking = true;
    game.player.attackCooldown = 0.5;
    
    // Attacking costs trivial energy (2 energy)
    game.stats.energy -= 2;
    if (game.stats.energy < 0) game.stats.energy = 0;
    
    const originalZ = game.player.weapon.position.z;
    game.player.weapon.position.z = -1.5; // Thrust forward
    setTimeout(() => {
        game.player.weapon.position.z = originalZ;
        game.player.isAttacking = false;
    }, 350); // 350ms so animation is visible
    
    const attackRange = 2.5;
    for (let enemy of game.enemies) {
        const distance = game.player.position.distanceTo(enemy.position);
        if (distance < attackRange && enemy.isActive) {
            const damage = game.stats.attack;
            enemy.health -= damage;
            
            // Hit effect on enemy body
            if (enemy.bodyMaterial) {
                const originalEmissive = enemy.bodyMaterial.emissive.getHex();
                enemy.bodyMaterial.emissive.setHex(0xffff00);
                enemy.bodyMaterial.emissiveIntensity = 1.0;
                setTimeout(() => {
                    if (enemy.bodyMaterial) {
                        enemy.bodyMaterial.emissive.setHex(originalEmissive);
                        enemy.bodyMaterial.emissiveIntensity = 0.5;
                    }
                }, 100);
            }
            
            const direction = new THREE.Vector3()
                .subVectors(enemy.position, game.player.position)
                .normalize();
            enemy.position.x += direction.x * 2;
            enemy.position.z += direction.z * 2;
        }
    }
}

// Respawn player
function respawnPlayer() {
    game.stats.health = game.stats.maxHealth;
    game.stats.energy = game.stats.maxEnergy;
    game.player.position.set(0, 1, 0);
}

// Mouse handlers
function onMouseMove(event) {
    game.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    game.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

function onMouseClick() {
    playerAttack();
}

// Window resize
function onResize() {
    game.camera.aspect = window.innerWidth / window.innerHeight;
    game.camera.updateProjectionMatrix();
    game.renderer.setSize(window.innerWidth, window.innerHeight);
}

// Update HUD
function updateHUD() {
    const healthPercent = (game.stats.health / game.stats.maxHealth) * 100;
    const energyPercent = (game.stats.energy / game.stats.maxEnergy) * 100;
    
    document.getElementById('healthBar').style.width = healthPercent + '%';
    document.getElementById('energyBar').style.width = energyPercent + '%';
    document.getElementById('healthText').textContent = ` ${Math.floor(game.stats.health)}/${game.stats.maxHealth}`;
    document.getElementById('energyText').textContent = ` ${Math.floor(game.stats.energy)}/${game.stats.maxEnergy}`;
    document.getElementById('enemyCount').textContent = game.enemies.length;
}

// Animation loop
let lastTime = 0;
let frameCount = 0;
let fpsTime = 0;

function animate(currentTime = 0) {
    requestAnimationFrame(animate);
    
    const delta = (currentTime - lastTime) / 1000;
    lastTime = currentTime;
    
    frameCount++;
    fpsTime += delta;
    if (fpsTime >= 1) {
        document.getElementById('fps').textContent = frameCount;
        frameCount = 0;
        fpsTime = 0;
    }
    
    updatePlayer(delta);
    updateEnemies(delta);
    updateHUD();
    
    game.renderer.render(game.scene, game.camera);
}

// Start game
init();
    </script>
